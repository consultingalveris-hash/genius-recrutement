<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Genius Recrutement : version de test des tests de recrutement et de la gestion du personnel."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Genius Recrutement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : espace RH en deux colonnes qui s'empilent sur téléphone ; parcours candidat dans une colonne étroite, comme sur un téléphone. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#F8FAFB;
  --line:#DDE2E8; --line-soft:#EEF1F4; --line-strong:#B8C1CC;
  --fg:#0F1B2D; --fg-2:#33404F; --muted:#4A5565;
  --accent:#0B6E66; --accent-fg:#FFFFFF; --accent-soft:#E1F0EE; --accent-soft-fg:#0B4F49; --accent-tint:#F0F8F7; --link:#0B6E66;
  --ok-bg:#E3F4EA; --ok-fg:#11683A; --warn-bg:#FFF3DC; --warn-fg:#8A4B00; --info-bg:#E1ECFA; --info-fg:#1D4F91;
  --neutral-bg:#EEF1F4; --track:#E6EAEE; --danger:#A1281C; --ink:#0F1B2D; --ink-fg:#FFFFFF;
  --focus:#1D4F91; --shadow:rgba(15,27,45,.16); --star:#B86E00; --scrim:rgba(15,27,45,.55);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#172029; --surface-2:#1C2731;
    --line:#2A3743; --line-soft:#222E39; --line-strong:#4A5A69;
    --fg:#E8EEF3; --fg-2:#C5CFD9; --muted:#A3B0BD;
    --accent:#2BA89D; --accent-fg:#06211F; --accent-soft:#12403C; --accent-soft-fg:#9FE0D8; --accent-tint:#13302E; --link:#5CC9BE;
    --ok-bg:#143825; --ok-fg:#8FD9AC; --warn-bg:#40300F; --warn-fg:#F2C777; --info-bg:#162F4D; --info-fg:#9CC4F5;
    --neutral-bg:#24303B; --track:#2A3743; --danger:#F08A7E; --ink:#E8EEF3; --ink-fg:#0E151C;
    --focus:#9CC4F5; --shadow:rgba(0,0,0,.5); --star:#F2B84B; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#172029; --surface-2:#1C2731;
  --line:#2A3743; --line-soft:#222E39; --line-strong:#4A5A69;
  --fg:#E8EEF3; --fg-2:#C5CFD9; --muted:#A3B0BD;
  --accent:#2BA89D; --accent-fg:#06211F; --accent-soft:#12403C; --accent-soft-fg:#9FE0D8; --accent-tint:#13302E; --link:#5CC9BE;
  --ok-bg:#143825; --ok-fg:#8FD9AC; --warn-bg:#40300F; --warn-fg:#F2C777; --info-bg:#162F4D; --info-fg:#9CC4F5;
  --neutral-bg:#24303B; --track:#2A3743; --danger:#F08A7E; --ink:#E8EEF3; --ink-fg:#0E151C;
  --focus:#9CC4F5; --shadow:rgba(0,0,0,.5); --star:#F2B84B; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{flex:none}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px)}
.hdr{background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.subnav{flex:1 1 100%;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.att{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.attl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;flex:1 1 100%}
.attl li{display:flex;gap:10px;align-items:center;justify-content:space-between;overflow-wrap:anywhere}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--neutral-bg);gap:2px}
.seg button{border:0;background:transparent;padding:0 14px;min-height:40px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;min-height:40px;padding:0 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-fg)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);min-width:0}
.who span:first-child{overflow-wrap:anywhere}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--ink-fg);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.main{padding-block:28px 40px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:clamp(24px,3.2vw,30px);font-weight:800;line-height:1.2;text-wrap:balance}
h2{margin:0;font-size:19px;font-weight:800;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:800}
p{margin:0}
.sub{margin-top:6px;color:var(--muted);max-width:65ch}
.eyebrow{font-size:14px;font-weight:700;color:var(--link)}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:24px}
.col.wide{flex:2 1 520px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:16px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rowx{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fields{display:flex;flex-wrap:wrap;gap:16px}
.field{flex:1 1 170px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;min-width:0}
.field.grow{flex:2 1 260px}
.in{height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
textarea.in{height:auto;padding:10px 12px;min-height:84px;resize:vertical;line-height:1.45}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{min-height:48px;padding:8px 22px}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn.dashed{border-style:dashed;width:100%}
.btn.full{width:100%}
.btn.pressed{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-soft-fg)}
.link{background:none;border:0;padding:0;min-height:0;color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.info{background:var(--info-bg);color:var(--info-fg)}
.pill.neutral{background:var(--neutral-bg);color:var(--fg-2)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--neutral-bg);color:var(--fg-2)}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:10px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.info{background:var(--info-bg);color:var(--info-fg)}
.note.plain{background:var(--neutral-bg);color:var(--fg-2)}
/* compétences */
.comp{display:flex;align-items:center;gap:12px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.comp .txt{flex:1 1 220px;min-width:0}
.comp .txt b{display:block;font-size:15px}
.comp input[type=range]{flex:1 1 160px;min-width:120px;accent-color:var(--accent);height:28px}
.comp .pct{width:58px;text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
/* questions */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.qlist{list-style:none;margin:0;padding:0 2px 2px 0;display:flex;flex-direction:column;gap:8px;max-height:620px;overflow:auto}
.q{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.q.on{border-color:var(--accent);background:var(--accent-tint)}
label.btn{cursor:pointer}
label.btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.phase.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.phase .j{font-weight:800;font-size:13px;color:var(--link)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;align-items:start}
.tin{width:118px;height:40px}
details.card>summary{cursor:pointer;min-height:28px}
.q[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line-strong);background:var(--surface);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;margin-top:1px}
.on>.box,.q[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent)}
.q .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;line-height:1.4}
.q .tags{display:flex;gap:6px;flex-wrap:wrap}
.optrow{display:flex;gap:10px;align-items:center}
.optrow input[type=radio]{width:20px;height:20px;accent-color:var(--accent);flex:none}
/* interrupteurs */
.sw{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid var(--line-soft);background:transparent;padding:12px 0;width:100%}
.sw .t{flex:1;min-width:0}
.sw .t b{display:block;font-size:15px}
.sw .t span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.sw .track{flex:none;width:44px;height:26px;border-radius:13px;background:var(--line-strong);padding:3px;display:flex}
.sw .track i{width:20px;height:20px;border-radius:50%;background:var(--surface);display:block}
.sw[aria-checked="true"] .track{background:var(--accent);justify-content:flex-end}
.sw[disabled]{cursor:not-allowed;opacity:.6}
/* tableaux */
.tbl-wrap{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:13px;font-weight:700;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.rank{font-weight:800;font-size:16px}
.name{font-weight:700}
.score{display:flex;align-items:center;gap:10px;min-width:150px}
.score strong{width:30px;text-align:right;font-variant-numeric:tabular-nums}
.tiles{display:flex;gap:16px;flex-wrap:wrap}
.tile{flex:1 1 180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.tile .k{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;line-height:1.5}
/* fiche */
.idcard{flex-direction:row;align-items:center;gap:16px 24px;flex-wrap:wrap}
.bigav{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-soft-fg);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.stat{padding:12px 18px;border-radius:12px;background:var(--bg);text-align:center}
.stat.main{background:var(--accent);color:var(--accent-fg)}
.stat .k{font-size:13px;font-weight:600}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;font-weight:700}
.cline{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.cline .n{flex:0 0 230px;font-weight:700}
.cline .n span{font-weight:500;color:var(--muted);font-size:13px}
.cline .bar{height:10px;border-radius:5px;flex:1 1 180px}
.cline .v{width:74px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.duo{display:flex;gap:16px;flex-wrap:wrap}
.duo>div{flex:1 1 240px;padding:14px 16px;border-radius:10px;font-size:14px}
.duo ul,.plainlist{margin:6px 0 0;padding-left:18px;line-height:1.55}
.strong{background:var(--ok-bg);color:var(--ok-fg)}
.explore{background:var(--warn-bg);color:var(--warn-fg)}
.ans{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ans .qt{font-weight:700;font-size:15px;line-height:1.4}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
/* parcours candidat */
.strip{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:420px;width:100%;margin-inline:auto;font-size:14px}
.phone{max-width:420px;width:100%;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-height:640px}
.phone .top{background:var(--accent);color:var(--accent-fg);padding:26px 22px 24px;display:flex;flex-direction:column;gap:10px}
.phone .top .kicker{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.phone .top h1{font-size:25px}
.phone .mid{flex:1;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.phone .bot{padding:14px 22px 22px;border-top:1px solid var(--line-soft)}
.facts{display:flex;gap:10px}
.facts>div{flex:1;background:var(--bg);border-radius:12px;padding:12px 6px;text-align:center}
.facts b{display:block;font-size:20px;font-weight:800}
.facts span{font-size:12px;color:var(--muted);font-weight:600}
.consent{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line-strong);border-radius:12px;padding:14px;background:var(--surface);font-size:13px;line-height:1.5;width:100%}
.consent.on{border-color:var(--accent)}
.qtop{padding:16px 22px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.qtop .l{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:700}
.timer{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--neutral-bg);font-variant-numeric:tabular-nums}
.qbody{background:var(--bg)}
.kind{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent-soft-fg)}
.qtext{margin:0;font-size:19px;font-weight:800;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:15px;line-height:1.4;width:100%}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-tint)}
.ring{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"] .ring{border-color:var(--accent)}
.opt[aria-checked="true"] .ring::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.done{align-items:center;text-align:center;padding-top:44px}
.done .ico{width:76px;height:76px;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:flex;align-items:center;justify-content:center}
.steps{align-self:stretch;text-align:left;background:var(--bg);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.steps .s{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.steps .s i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:13px;font-style:normal;display:flex;align-items:center;justify-content:center}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.pick:last-of-type{border-bottom:0}
.foot{padding-block:0 32px;font-size:13px;color:var(--muted);display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--ink-fg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.stars{display:inline-flex;gap:1px;vertical-align:-3px;color:var(--line-strong)}
.stars>span{color:var(--line-strong)}
.stars>span.on{color:var(--star)}
.ovl{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{max-height:100%;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 40px var(--shadow)}
.pick5{display:flex;align-items:center;gap:2px 4px;flex-wrap:wrap}
.sbtn{width:48px;height:48px;border:0;background:transparent;border-radius:10px;color:var(--line-strong);display:flex;align-items:center;justify-content:center;padding:0}
.sbtn.on{color:var(--star)}
.pick5 .lab{margin-left:8px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:2 1 220px;min-width:0;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:var(--muted);pointer-events:none}
.search .in{padding-left:38px}
.tools select.in{flex:1 1 150px;width:auto}
.tools .exp{display:flex;gap:8px;margin-left:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:24px}
.todo{display:flex;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.todo:last-child{border-bottom:0}
.todo .tx{flex:1 1 260px;min-width:0}
.todo .tag{flex:none}
.ev{display:flex;gap:8px 14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}

/* Composition automatique : répartit les questions selon les pondérations (plus forts restes), au plus près du niveau attendu. */
function compose(t,all){
  var n=Math.min(t.count,all.length),by={},alloc={},used=0,rem=[];
  var tw=COMPS.reduce(function(s,c){return s+(+t.weights[c.k]||0);},0)||1;
  COMPS.forEach(function(c){
    by[c.k]=all.filter(function(q){return q.c===c.k;}).sort(function(a,b){return Math.abs(LV.indexOf(a.lvl)-LV.indexOf(t.level))-Math.abs(LV.indexOf(b.lvl)-LV.indexOf(t.level));});
    var x=n*(+t.weights[c.k]||0)/tw,f=Math.min(Math.floor(x),by[c.k].length);
    alloc[c.k]=f;used+=f;rem.push([c.k,x-Math.floor(x)]);
  });
  rem.sort(function(a,b){return b[1]-a[1];});
  for(var pass=0;pass<40&&used<n;pass++){
    var moved=false;
    for(var i=0;i<rem.length&&used<n;i++){var k=rem[i][0];if(alloc[k]<by[k].length&&((+t.weights[k]||0)>0||pass>0)){alloc[k]++;used++;moved=true;}}
    if(!moved&&pass>0)break;
  }
  var out=[];COMPS.forEach(function(c){by[c.k].slice(0,alloc[c.k]).forEach(function(q){out.push(q.id);});});
  return out;
}

function scoreOf(c){
  var comp={},detail=null,answered=null,total=null,secs=c.secs||0,exits=c.exits||0,timeout=!!c.timeout;
  if(c.scores){COMPS.forEach(function(k){comp[k.k]=c.scores[k.k];});}
  else if(c.run){
    var acc={};detail=[];answered=0;total=c.run.order.length;
    c.run.order.forEach(function(o){
      var q=qById(o.q);if(!q)return;
      var mx=maxOf(q),a=c.run.answers[o.q],pts=(a==null||!q.o[a])?0:q.o[a][1];
      if(a!=null)answered++;
      if(!acc[q.c])acc[q.c]=[0,0];
      acc[q.c][0]+=pts;acc[q.c][1]+=mx;
      detail.push({q:q,a:a,pts:pts,max:mx});
    });
    COMPS.forEach(function(k){comp[k.k]=acc[k.k]&&acc[k.k][1]?Math.round(100*acc[k.k][0]/acc[k.k][1]):null;});
    secs=Math.min(c.run.limit,Math.round(((c.run.endedAt||Date.now())-c.run.startedAt)/1000));
    exits=c.run.exits||0;timeout=!!c.run.timeout;
  }
  var ws=0,sum=0;
  COMPS.forEach(function(k){var v=comp[k.k],w=+S.test.weights[k.k]||0;if(v!=null){ws+=w;sum+=w*v;}});
  var alerts=[];
  if(exits>0)alerts.push(exits+(exits>1?' sorties':' sortie')+' d’onglet');
  if(timeout)alerts.push('Temps dépassé');
  return {comp:comp,global:ws?Math.round(sum/ws):0,detail:detail,answered:answered,total:total,secs:secs,exits:exits,timeout:timeout,alerts:alerts};
}
function ranking(){

}

    defs.map(function(d){return '<button class="sw" role="switch" data-a="rule:'+d[0]+'" aria-checked="'+(!!r[d[0]])+'"><span class="t"><b>'+d[1]+'</b><span>'+d[2]+'</span></span><span class="track"><i></i></span></button>';}).join('')+
    '<button class="sw" role="switch" aria-checked="false" disabled><span class="t"><b>Questionnaire de personnalité</b><span>Facultatif, non noté, sous licence. Non inclus dans cette version d’essai.</span></span><span class="track"><i></i></span></button>'+
    '<label class="field" style="margin-top:12px">Date limite<input class="in" type="date" id="f-deadline" data-f="deadline" value="'+esc(t.deadline)+'"></label></section>';
  h+='</div>';
  h+='<section class="card col wide"><div class="between"><h2>Candidats invités</h2>'+(S.cands.some(function(c){return c.ex;})?'<button class="btn sm" data-a="rmExamples">Retirer les exemples</button>':'')+'</div>'+
    '<div class="rowx"><input class="in" id="nc-name" placeholder="Nom et prénom" aria-label="Nom et prénom" style="flex:1 1 180px;width:auto"><input class="in" id="nc-contact" placeholder="Téléphone WhatsApp ou e-mail" aria-label="Téléphone WhatsApp ou e-mail" style="flex:1 1 220px;width:auto"><button class="btn primary" data-a="addCand">Inviter</button></div>';
  h+=toolbar('cands','Nom ou contact du candidat',[['st','Tous les statuts',['Invité','En cours','Terminé','Expiré']]],true)+'<div data-tbl="cands">'+candsBody()+'</div>';
  h+='</section></div>';
  h+='<div class="between"><button class="btn big" data-a="tab:test">Modifier le test</button><button class="btn primary big" data-a="tab:res">Voir le classement'+I.arrow+'</button></div>';
  return h;
}

function viewFiche(){
  var c=cand(S.ficheId);
  if(!c||c.status!=='fini'){S.tab='res';return viewRes();}
  var s=scoreOf(c),rk=ranking(),rank=1;
  rk.forEach(function(r,i){if(r.c.id===c.id)rank=i+1;});
  var forts=[],expl=[];
  COMPS.forEach(function(k){var v=s.comp[k.k];if(v==null)return;if(v>=75)forts.push(k.name+' ('+v+' / 100)');else if(v<65)expl.push(k.name+' ('+v+' / 100). '+k.ask);});
  if(s.detail){
    s.detail.forEach(function(d){
      if(d.q.c==='S'&&d.pts===d.max&&forts.length<5)forts.push(d.q.skill);
      if(d.pts*2<=d.max&&d.max>1&&expl.length<5)expl.push(d.q.skill+' : réponse à reprendre en entretien');
    });
  }
  var h='<div><button class="btn sm" data-a="tab:res">'+I.back+'Retour au classement</button></div>';
  h+='<section class="card idcard"><span class="bigav" aria-hidden="true">'+esc(initials(c.name))+'</span><div style="flex:1 1 240px;min-width:0"><h1>'+esc(c.name)+'</h1><div class="muted small" style="margin-top:4px">'+esc(S.test.title)+(c.run&&c.run.endedAt?' · test terminé le '+frDate(c.run.endedAt):'')+(c.scores?' · <strong>Données d’exemple</strong>':'')+'</div></div>'+
    '<div class="rowx" style="align-items:stretch"><div class="stat"><div class="k muted">Rang</div><div class="v">'+rank+'<small class="muted"> / '+rk.length+'</small></div></div><div class="stat main"><div class="k">Score global</div><div class="v">'+s.global+'<small> / 100</small></div></div></div></section>';
  h+='<div class="cols"><div class="col wide">';
  h+='<section class="card"><h2>Résultats par compétence</h2>'+
    COMPS.map(function(k){var v=s.comp[k.k];return '<div class="cline"><div class="n">'+k.name+' <span>('+(+S.test.weights[k.k]||0)+' %)</span></div><div class="bar"><i style="width:'+(v||0)+'%"></i></div><div class="v">'+(v==null?'Non mesuré':v+' / 100')+'</div></div>';}).join('')+
    '<div class="duo"><div class="strong"><h3>Points forts</h3>'+(forts.length?'<ul>'+forts.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p style="margin-top:6px">Aucune compétence au-dessus de 75 / 100.</p>')+'</div>'+
    '<div class="explore"><h3>À explorer en entretien</h3>'+(expl.length?'<ul>'+expl.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p style="margin-top:6px">Aucun point faible marqué dans ce test.</p>')+'</div></div></section>';
  h+='<section class="card"><h2>Réponses du candidat</h2>';
  if(s.detail){
    h+=s.detail.map(function(d){
      var full=d.pts===d.max,best=null;
      d.q.o.forEach(function(o){if(o[1]===d.max&&!best)best=o[0];});
      return '<div class="ans"><div class="rowx"><span class="tag">'+compOf(d.q.c).short+'</span><span class="tag">'+esc(d.q.lvl)+'</span></div><div class="qt">'+esc(d.q.t)+'</div>'+
        '<div><span class="muted">Réponse du candidat :</span> '+(d.a==null?'<em>pas de réponse (temps écoulé)</em>':esc(d.q.o[d.a][0]))+'</div>'+
        (full?'':'<div><span class="muted">Réponse attendue :</span> '+esc(best)+'</div>')+
        '<div><span class="pill '+(full?'ok':(d.pts>0?'warn':'neutral'))+'">'+d.pts+' / '+d.max+' point'+(d.max>1?'s':'')+'</span></div></div>';
    }).join('');
  }else{
    h+='<p class="muted">Les candidats d’exemple n’ont pas de réponses détaillées. Passez le test vous-même depuis l’onglet Candidats pour voir une fiche complète.</p>';
  }
  h+='</section></div><div class="col">';
  var d=c.decision,dt=d&&d.type;
  h+='<section class="card" style="gap:12px"><h2>Décision</h2>'+
    '<button class="btn full '+(dt==='conv'?'pressed':'primary')+'" data-a="decide:conv" aria-pressed="'+(dt==='conv')+'">Convoquer en entretien</button>'+
    '<button class="btn full '+(dt==='att'?'pressed':'')+'" data-a="decide:att" aria-pressed="'+(dt==='att')+'">Mettre en attente</button>'+
    '<button class="btn full danger '+(dt==='ec'?'pressed':'')+'" data-a="decide:ec" aria-pressed="'+(dt==='ec')+'">Écarter (motif obligatoire)</button>';
  if(S.ui.ec){
    h+='<label class="field">Motif<textarea class="in" id="motif" rows="3" placeholder="Exemple : score insuffisant en mises en situation"></textarea></label><div class="rowx"><button class="btn primary" data-a="confirmEc">Confirmer</button><button class="btn" data-a="cancelEc">Annuler</button></div>';
  }else if(d){
    h+='<div class="note plain" role="status">'+({conv:'Candidat à convoquer. L’invitation à l’entretien reste à envoyer par vos soins.',att:'Candidature mise en attente.',ec:'Candidature écartée. Motif : '+esc(d.motif||'')}[dt])+'</div>';
  }
  if(dt==='conv'&&!S.ui.ec)h+='<button class="btn full" data-a="hire:'+c.id+'">'+(c.hired&&emp(c.hired)?'Ouvrir son dossier salarié':'Embaucher : créer son dossier salarié')+'</button>';
  h+='</section>';
  var rows=[['Temps total',dur(s.secs)+(c.run?' / '+dur(c.run.limit):'')]];
  if(s.total!=null)rows.push(['Questions répondues',s.answered+' / '+s.total]);
  rows.push(['Sorties d’onglet',String(s.exits)]);
  if(s.timeout)rows.push(['Fin du test','Temps écoulé']);
  if(c.run)rows.push(['Consentement',c.run.consentAt?'Accepté le '+frDate(c.run.consentAt):'Non demandé']);
  h+='<section class="card" style="gap:4px"><h2 style="margin-bottom:8px">Déroulement du test</h2>'+rows.map(function(r){return '<div class="kv"><span>'+r[0]+'</span><strong>'+esc(r[1])+'</strong></div>';}).join('')+'</section>';
  var rf=refsCand(c);
  h+='<section class="card"><h2>Références d’anciens employeurs</h2>'+(rf.length?rf.map(function(r){return '<div class="ans"><div class="between"><strong>'+esc(r.co||'Ancien employeur')+'</strong><span>'+stars(refAvg(r))+' <strong class="small num">'+r1(refAvg(r))+'</strong></span></div><div>'+refRows(r)+'</div>'+(r.reply?'<div><span class="muted">Réponse du candidat :</span> '+esc(r.reply)+'</div>':'')+'</div>';}).join(''):'<p class="muted">Ce candidat n’a joint aucune référence.</p>')+'<p class="muted small">Le candidat voit ses références, peut y répondre et choisit de les joindre.</p></section>';
  h+='<section class="card"><h2>Personnalité</h2><p class="small" style="color:var(--fg-2)">Le questionnaire sous licence n’est pas inclus dans cette version d’essai. Il ne sera jamais utilisé pour le classement : il donnera seulement des pistes de questions pour l’entretien.</p></section>';
  h+='</div></div>';
  return h;
}

/* ---------- quotidien RH, personnel, vue contrôle ---------- */
function emp(id){for(var i=0;i<S.emps.length;i++)if(S.emps[i].id===id)return S.emps[i];return null;}
function offer(id){for(var i=0;i<S.offers.length;i++)if(S.offers[i].id===id)return S.offers[i];return null;}
function appById(id){for(var i=0;i<S.apps.length;i++)if(S.apps[i].id===id)return S.apps[i];return null;}
function isOut(e){return !!(e.sortie&&e.sortie<=today());}
function actifs(){return S.emps.filter(function(e){return !isOut(e);});}
function empStatus(e){
  var t=today(),st=['Actif','ok'];
  if(isOut(e))return ['Sorti','neutral'];
  e.ev.forEach(function(v){
    if(v.t==='conge'&&v.st==='valide'&&v.d<=t&&t<=v.f)st=['En congé','info'];
    if(v.t==='absence'&&v.d<=t&&t<=addD(v.d,(+v.n||1)-1))st=['Absent','warn'];
  });
  return st;
}
function anciennete(e){var m=Math.max(0,Math.floor(dd(e.entree,isOut(e)?e.sortie:today())/30.44)),y=Math.floor(m/12),r=m%12;return (y?y+' an'+(y>1?'s':'')+(r?' ':''):'')+(r||!y?r+' mois':'');}
/* congés sur les 12 derniers mois : acquis au rythme réglé, moins les congés annuels validés déjà pris */
function conges(e){
  var t=today(),from=off(-365),start=e.entree>from?e.entree:from,end=isOut(e)?e.sortie:t,pris=0;
  var acquis=Math.round(Math.max(0,Math.floor(dd(start,end)/30.44))*(+S.hr.rate||0)*10)/10;
  e.ev.forEach(function(v){if(v.t==='conge'&&v.st==='valide'&&v.x==='Congé annuel'){var a=v.d<from?from:v.d,b=v.f>t?t:v.f;if(a<=b)pris+=ouvr(a,b);}});
  return {acquis:acquis,pris:pris,solde:Math.round((acquis-pris)*10)/10};
}
function absStats(){
  var from=off(-30),t=today(),j=0,a=actifs();
  a.forEach(function(e){e.ev.forEach(function(v){if(v.t==='absence'&&v.d>=from&&v.d<=t)j+=(+v.n||1);});});
  return {jours:j,taux:a.length?Math.round(1000*j/(a.length*26))/10:0};
}
function num(x){return String(x).replace('.',',');}
function nextMat(){return 'M-'+('00'+(S.mat++)).slice(-3);}
function exPill(list){return list.some(function(x){return x.ex;})?'<span class="pill neutral">Contient des données d’exemple</span>':'';}
function todo(){
  var t=today(),L=[];
  actifs().forEach(function(e){
    var n,go='emp:'+e.id;
    if(e.essai){n=dd(t,e.essai);if(n>=0&&n<=15)L.push({p:1,k:'Période d’essai',txt:'Fin de période d’essai de '+e.name+(n?' dans '+n+' jour'+(n>1?'s':''):' aujourd’hui')+' ('+fr(e.essai)+') : confirmer ou mettre fin.',a:go});}
    if(e.fin){n=dd(t,e.fin);if(n>=0&&n<=30)L.push({p:1,k:'Fin de contrat',txt:'Contrat de '+e.name+' ('+e.ct+') à échéance le '+fr(e.fin)+' : renouveler ou préparer la sortie.',a:go});}
    e.ev.forEach(function(v){
      if(v.t==='conge'&&v.st==='attente')L.push({p:2,k:'Congé',txt:'Demande de congé de '+e.name+' à valider (du '+fr(v.d)+' au '+fr(v.f)+').',a:go});
      if(v.t==='conge'&&v.st==='valide'){n=dd(t,v.f);if(n>=0&&n<=1)L.push({p:3,k:'Retour',txt:'Retour de congé de '+e.name+' le '+fr(addD(v.f,1))+'.',a:go});}
      if(v.t==='absence'&&v.st!=='justifiee'&&v.d>=off(-30))L.push({p:2,k:'Absence',txt:'Absence de '+e.name+' du '+fr(v.d)+' sans justificatif : à régulariser.',a:go});
      if(v.t==='objectif'&&(+v.n||0)<100){n=dd(t,v.d);if(n>=0&&n<=30)L.push({p:3,k:'Objectif',txt:'Objectif de '+e.name+' à échéance le '+fr(v.d)+' ('+(+v.n||0)+' % atteint).',a:go});}
    });
  });
  S.emps.forEach(function(e){
    if(isOut(e)&&!e.ref)L.push({p:3,k:'Référence',txt:'Sortie de '+e.name+' : référence à rédiger.',a:'emp:'+e.id});
    if(!isOut(e)||!e.docs)return;
    var m=[];if(!e.docs.cert)m.push('certificat de travail');if(!e.docs.solde)m.push('solde de tout compte');
    if(m.length)L.push({p:2,k:'Sortie',txt:'Sortie de '+e.name+' le '+fr(e.sortie)+' : '+m.join(' et ')+' à remettre.',a:'emp:'+e.id});
  });
  var na=S.apps.filter(function(a){return !a.testAt&&!a.rejet;}).length;
  if(na)L.push({p:2,k:'Recrutement',txt:na+' candidature'+(na>1?'s':'')+' à examiner.',a:'tab:offres'});
  var nd=S.cands.filter(function(c){return c.status==='fini'&&!c.decision;}).length;
  if(nd)L.push({p:3,k:'Recrutement',txt:nd+' test'+(nd>1?'s terminés':' terminé')+' sans décision.',a:'tab:res'});
  var pp=perPrev(),cs=closeStats(pp);
  if(cs.late)L.push({p:1,k:'Clôture',txt:'Clôture de '+perLabel(pp)+' : '+cs.late+' point'+(cs.late>1?'s':'')+' en retard sur le calendrier.',a:'goPer:mois'});
  if(!S.temps[pp])L.push({p:2,k:'Paie',txt:'Pointages de '+perLabel(pp)+' à importer.',a:'goPer:temps'});
  else{var nv=tempsRows(pp).filter(function(r){return !r.v.rh;}).length;if(nv)L.push({p:2,k:'Paie',txt:nv+' ligne'+(nv>1?'s':'')+' d’heures de '+perLabel(pp)+' à valider avant l’envoi à la comptabilité.',a:'goPer:temps'});}
  return L.sort(function(a,b){return a.p-b.p;});
}
function hasLeave(e){return e.ct!=='Consultance';}
function avgOf(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function r1(x){return num(Math.round(x*10)/10);}
function stars(n){var r=Math.round(n),h='';for(var i=1;i<=5;i++)h+='<span'+(i<=r?' class="on"':'')+'>'+I.star+'</span>';return '<span class="stars" role="img" aria-label="'+r1(n)+' sur 5">'+h+'</span>';}
/* références d'anciens employeurs : le candidat les voit, y répond et choisit de les joindre */
var CRIT=[['p','Ponctualité et assiduité'],['q','Qualité du travail'],['t','Travail en équipe']];
var REP={oui:'Oui',reserve:'Oui, avec réserve',non:'Non'};
function refAvg(r){return (r.crit.p+r.crit.q+r.crit.t)/3;}
function refsAvg(a){return avgOf(a.map(refAvg));}
function refsCand(c){
  var a=(c.refs||[]).slice();
  S.emps.forEach(function(e){if(e.ref&&e.ref.shared&&(c.hired===e.id||norm(e.name)===norm(c.name)))a.push({co:S.test.company||'Ancien employeur',crit:e.ref.crit,rep:e.ref.rep,reply:e.ref.reply,at:e.ref.at});});
  return a;
}
function refCell(c){var a=refsCand(c);return a.length?stars(refsAvg(a))+' <span class="small num"><strong>'+r1(refsAvg(a))+'</strong> <span class="muted">('+a.length+')</span></span>':'<span class="muted small">Aucune</span>';}
function refRows(r){return CRIT.map(function(c){return '<div class="kv"><span>'+c[1]+'</span><strong>'+stars(r.crit[c[0]])+'</strong></div>';}).join('')+'<div class="kv"><span>L’employeur le reprendrait-il ?</span><strong>'+(REP[r.rep]||'—')+'</strong></div>';}
/* note publique de l'entreprise, donnée par ses anciens salariés */
function coNote(){var a=S.coRatings.map(function(x){return x.n;});return {n:a.length,avg:avgOf(a),ex:S.coRatings.some(function(x){return x.ex;})};}
function coBadge(){var c=coNote();return c.n?stars(c.avg)+' <span class="small"><strong>'+r1(c.avg)+'</strong> sur 5 · '+c.n+' avis d’anciens salariés'+(c.ex?', dont des exemples':'')+'</span>':'<span class="muted small">Entreprise pas encore notée</span>';}
function coReqOpen(){
  var i,r;
  if(S.mode!=='cand')return null;
  if(S.ui.coRate){for(i=0;i<S.coReq.length;i++)if(S.coReq[i].id===S.ui.coRate&&!S.coReq[i].done)return S.coReq[i];return null;}
  if(S.ctab==='test'){var pc=cand(S.playId);if(pc&&pc.status==='cours')return null;}
  for(i=0;i<S.coReq.length;i++){r=S.coReq[i];if(!r.done&&!r.later)return r;}
  return null;
}
function starPick(key,v){
  return '<div class="pick5" role="radiogroup" aria-label="Note de une à cinq étoiles">'+[1,2,3,4,5].map(function(i){return '<button class="sbtn'+(i<=v?' on':'')+'" role="radio" aria-checked="'+(i===v)+'" aria-label="'+i+' étoile'+(i>1?'s':'')+'" data-a="star:'+key+'|'+i+'">'+I.starBig+'</button>';}).join('')+'<span class="muted small lab">'+(v?v+' sur 5':'Choisissez une note')+'</span></div>';
}
function modalHtml(){
  var e,r,v;
  if(S.ui.viewJust&&JUST[S.ui.viewJust])return '<div class="ovl"><div class="modal" role="dialog" aria-modal="true" aria-label="Justificatif" style="max-width:720px"><div class="between"><h2>Justificatif</h2><button class="btn sm" data-a="cancelUi">Fermer</button></div><img src="'+JUST[S.ui.viewJust]+'" alt="Justificatif d’absence" style="border-radius:8px"></div></div>';
  if(S.mode==='rh'&&S.ui.rate){
    e=emp(S.ui.rate);if(!e)return '';
    var ok=CRIT.every(function(c){return !!S.ui['r'+c[0]];})&&!!S.ui.rr;
    return '<div class="ovl"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="md-t"><h2 id="md-t">Référence pour '+esc(e.name)+'</h2><p class="muted">'+esc(e.name)+' verra cette référence, pourra y répondre et choisira de la joindre ou non à ses candidatures.</p>'+
      CRIT.map(function(c){return '<div><h3>'+c[1]+'</h3>'+starPick('r'+c[0],S.ui['r'+c[0]]||0)+'</div>';}).join('')+
      '<div><h3 style="margin-bottom:8px">Le reprendriez-vous ?</h3><div class="chips">'+Object.keys(REP).map(function(k){return '<button class="chip" data-a="rr:'+k+'" aria-pressed="'+(S.ui.rr===k)+'">'+REP[k]+'</button>';}).join('')+'</div></div>'+
      '<div class="rowx"><button class="btn primary" data-a="rateSave"'+(ok?'':' disabled')+'>Enregistrer la référence</button><button class="btn" data-a="rateLater">Plus tard</button></div></div></div>';
  }
  r=coReqOpen();
  if(r){
    e=emp(r.emp);v=S.ui.cv||0;
    return '<div class="ovl"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="md-t"><h2 id="md-t">Notez '+esc(S.test.company||'votre ancienne entreprise')+'</h2><p class="muted">Vous avez quitté cette entreprise le '+(e&&e.sortie?fr(e.sortie):frDate(r.at))+'. Votre note, de une à cinq étoiles, sera publique et comptera dans sa moyenne, sans votre nom.</p>'+starPick('cv',v)+'<div class="rowx"><button class="btn primary" data-a="coSave"'+(v?'':' disabled')+'>Envoyer ma note</button><button class="btn" data-a="coLater">Plus tard</button></div><p class="muted small">Essai : c’est la fenêtre que reçoit '+esc(r.name)+' dans son espace candidat.</p></div></div>';
  }
  return '';
}
function tilesHtml(arr){return '<div class="tiles">'+arr.map(function(x){return '<div class="tile"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>';}).join('')+'</div>';}

function viewJour(){
  var a=actifs(),t=today(),ab=0,cg=0,st=absStats(),L=todo(),lg;
  a.forEach(function(e){var s=empStatus(e)[0];if(s==='Absent')ab++;if(s==='En congé')cg++;});
  if(S.hr.routine.date!==t)S.hr.routine={date:t,done:{}};
  try{lg=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){lg=fr(t);}
  var h='<div class="head"><div><div class="eyebrow">'+esc(lg)+'</div><h1 style="margin-top:6px">Aujourd’hui</h1><p class="sub">Ce qui demande votre attention, tiré des dossiers du personnel et du recrutement.</p></div><div class="rowx">'+exPill(S.emps)+'<button class="btn primary" data-a="tab:ctrl">'+I.shield+'Vue contrôle</button></div></div>';
  h+=tilesHtml([['Effectif actif',a.length],['Absents aujourd’hui',ab],['En congé aujourd’hui',cg],['Absentéisme sur 30 jours',num(st.taux)+' %'],['Note publique de l’entreprise',coNote().n?r1(coNote().avg)+' / 5':'—']]);
  h+='<div class="cols"><section class="card col wide" style="gap:6px"><div class="between" style="margin-bottom:8px"><h2>À traiter</h2><span class="pill '+(L.length?'warn':'ok')+'">'+L.length+' point'+(L.length>1?'s':'')+'</span></div>';

function services(){var o={};S.emps.forEach(function(e){if(e.svc)o[e.svc]=1;});return Object.keys(o).sort();}

function toolbar(key,ph,selects,exp){

    (selects||[]).map(function(s){return '<select class="in" id="sf-'+key+'-'+s[0]+'" data-sf="'+key+':'+s[0]+'" aria-label="'+s[1]+'"><option value="">'+s[1]+'</option>'+s[2].map(function(x){return typeof x==='string'?opt(x,x,f[s[0]]):opt(x[0],x[1],f[s[0]]);}).join('')+'</select>';}).join('')+

function tblHtml(d){

  return '<div class="tbl-wrap"><table style="min-width:'+d.minw+'px"><thead><tr>'+d.heads.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+d.rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(typeof c==='number'||i===0?' class="num"':'')+'>'+(typeof c==='number'?num(c):esc(c))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';

    list.slice(0,lim).map(function(e){var s=empStatus(e);return '<tr><td class="num">'+esc(e.mat)+'</td><td><span class="name">'+esc(e.name)+'</span>'+(e.ex?' <span class="tag">Exemple</span>':'')+'</td><td>'+esc(e.poste)+'</td><td class="muted">'+esc(e.svc||'—')+'</td><td>'+esc(e.ct)+'</td><td class="num">'+fr(e.entree)+'</td><td><span class="pill '+s[1]+'">'+s[0]+'</span></td><td><button class="btn sm" data-a="emp:'+e.id+'">Ouvrir</button></td></tr>';}).join('')+'</tbody></table></div>';

function viewPers(){

      '<div class="fields"><label class="field">Contrat<select class="in" id="ne-ct">'+CONTRATS.map(function(x){return opt(x,x,'CDI');}).join('')+'</select></label><label class="field">Date d’entrée<input class="in" type="date" id="ne-entree" value="'+today()+'"></label><label class="field">Fin de période d’essai<input class="in" type="date" id="ne-essai"></label><label class="field">Fin de contrat (CDD, stage)<input class="in" type="date" id="ne-fin"></label></div>'+

  }

function ctrlEmps(){var x=F.ctrl;return S.emps.filter(function(e){return (!x.svc||e.svc===x.svc)&&hit(x.q,[e.name,e.mat,e.poste,e.svc]);});}
function ctrlData(){
  var t=today(),from=off(-365),L=ctrlEmps(),abs=[],disc=[],mouv=[];
  L.forEach(function(e){e.ev.forEach(function(v){
    if(v.t==='absence'&&v.d>=from)abs.push([v.d,e.name,(+v.n||1),v.st==='justifiee'?'Remis':'Manquant']);
    if(v.t==='sanction')disc.push([v.d,e.name,v.x,v.txt]);
    if(v.t==='poste'||v.t==='carriere')mouv.push([v.d,e.name,v.t==='poste'?'Changement de poste':v.x,v.txt]);
  });});
  var byDate=function(x,y){return x[0]<y[0]?1:-1;},frd=function(r){r=r.slice();r[0]=fr(r[0]);return r;};
  abs.sort(byDate);disc.sort(byDate);mouv.sort(byDate);
  return [
    {name:'Registre du personnel',heads:['N°','Matricule','Nom et prénom','Poste','Service','Contrat','Entrée','Sortie','Motif de sortie'],minw:860,empty:'Aucun salarié ne correspond.',
      rows:L.slice().sort(function(x,y){return x.entree<y.entree?-1:1;}).map(function(e,i){return [i+1,e.mat,e.name,e.poste,e.svc||'—',e.ct,fr(e.entree),e.sortie?fr(e.sortie):'—',e.motif||'—'];})},
    {name:'Congés sur 12 mois',heads:['Salarié','Acquis','Pris','Solde','Congé en cours ou prévu'],minw:620,empty:'Aucun salarié actif ne correspond.',
      rows:L.filter(function(e){return !isOut(e)&&hasLeave(e);}).map(function(e){var c=conges(e),nx=e.ev.filter(function(v){return v.t==='conge'&&v.st!=='refuse'&&v.f>=t;}).map(function(v){return 'du '+fr(v.d)+' au '+fr(v.f)+(v.st==='attente'?' (à valider)':'');}).join(' ; ');return [e.name,c.acquis,c.pris,c.solde,nx||'—'];})},
    {name:'Absences sur 12 mois',heads:['Date','Salarié','Jours','Justificatif'],minw:420,empty:'Aucune absence enregistrée.',rows:abs.map(frd)},
    {name:'Registre disciplinaire',heads:['Date','Salarié','Nature','Motif'],minw:420,empty:'Aucune sanction enregistrée.',rows:disc.map(frd)},
    {name:'Postes et carrière',heads:['Date','Salarié','Nature','Détail'],minw:620,empty:'Aucun mouvement enregistré.',rows:mouv.map(frd)}
  ];
}
function ctrlBody(){
  var d=ctrlData();

/* ---------- import des pointages ---------- */
function parseCsv(tx){

  var first=tx.split(/\r?\n/)[0]||'',sep=[';','\t',','].sort(function(a,b){return first.split(b).length-first.split(a).length;})[0];
  var rows=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<tx.length;i++){
    ch=tx[i];
    if(q){if(ch==='"'){if(tx[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&tx[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}

}

/* ---------- calcul des heures ---------- */
function ov(a,b,x,y){return Math.max(0,Math.min(b,y)-Math.max(a,x));}
function weekKey(d){return addD(d,-((dow(d)+6)%7));}

function tempsRows(p){

  var R=S.hr.rules,days=perDays(p),byMat={},deb=tmin(R.debut),ns=tmin(R.nuitD),ne=tmin(R.nuitF),H=(+R.hebdo||40)*60,day=(+R.mens||173.33)*60/Math.max(1,days.filter(workday).length);

  return S.emps.filter(function(e){return inPer(e,p);}).sort(function(a,b){return a.mat<b.mat?-1:1;}).map(function(e){
    var P=byMat[e.mat]||[],dayMin={},night=0,sunHol=0,late=0,weeks={},worked=0;
    P.forEach(function(x){
      var a=x[2],b=x[3];if(b<=a)b+=1440;

      if(a<720&&a>deb+(+R.tol||0))late++;
      if(dow(x[1])===0||isHol(x[1]))sunHol+=dur;else{var w=weekKey(x[1]);weeks[w]=(weeks[w]||0)+dur;}
      dayMin[x[1]]=(dayMin[x[1]]||0)+dur;worked+=dur;
    });
    var nrm=0,hs1=0,hs2=0;
    Object.keys(weeks).forEach(function(k){var w=weeks[k],hs=Math.max(0,w-H);nrm+=Math.min(w,H);hs1+=Math.min(hs,480);hs2+=Math.max(0,hs-480);});

    return {e:e,mat:e.mat,name:e.name,svc:e.svc||'',planned:planned,worked:worked,norm:nrm,hs1:hs1,hs2:hs2,night:night,sunHol:sunHol,wd:wd,pd:pd,cg:cg,absJ:absJ,absNJ:absNJ,missing:missing,late:late,ecart:ecart,v:v};

function genSample(p){

var ATT={};

  render();toast((n?n+' fichier'+(n>1?'s':'')+' joint'+(n>1?'s':'')+'.':'Aucun fichier joint.')+(bad.length?' Refusé : '+bad.join(', ')+' (format non accepté ou plus de 20 Mo).':''));

function doSend(k,force){

      else if(ty==='prise'){ev.x=val('ev-x');ev.txt=val('ev-txt');}
      else if(ty==='objectif'){ev.txt=val('ev-txt');ev.n=Math.max(0,Math.min(100,Math.round(+val('ev-n')||0)));if(!ev.txt){toast('Décrivez l’objectif.');return;}}
      else if(ty==='poste'){var np=val('ev-txt'),ns=val('ev-svc')||e.svc||'';if(!np){toast('Indiquez le nouveau poste.');return;}ev.txt=e.poste+' → '+np+(ns?' ('+ns+')':'');e.poste=np;e.svc=ns;}
      else{ev.x=val('ev-x');ev.txt=val('ev-txt');if(!ev.txt){toast(ty==='sanction'?'Le motif est obligatoire.':'Précisez le détail.');return;}}
      e.ev.push(ev);S.ui={};toast('Enregistré dans le dossier de '+e.name+'.');break;
    case 'evSt':
      e=emp(S.empId);if(!e)return;
      var pr=v.split('|');e.ev.forEach(function(x){if(x.id===pr[0])x.st=pr[1];});break;
    case 'evDel':e=emp(S.empId);if(!e)return;e.ev=e.ev.filter(function(x){return x.id!==v;});break;
    case 'objPlus':e=emp(S.empId);if(!e)return;e.ev.forEach(function(x){if(x.id===v)x.n=Math.min(100,(+x.n||0)+10);});break;
    case 'showSortie':S.ui={sortie:true};break;
    case 'saveSortie':
      e=emp(S.empId);if(!e)return;
      var sd=val('so-d');if(!sd){toast('Indiquez la date de sortie.');return;}
      if(sd<e.entree){toast('La sortie ne peut pas précéder l’entrée.');return;}
      e.sortie=sd;e.motif=val('so-m');e.docs={cert:false,solde:false};if(!S.coReq.some(function(x){return x.emp===e.id&&!x.done;}))S.coReq.push({id:'r'+(S.seq++),emp:e.id,name:e.name,at:Date.now()});S.ui={rate:e.id,rv:0};toast('Sortie enregistrée. Pensez au certificat de travail et au solde de tout compte.');break;
    case 'undoSortie':e=emp(S.empId);if(!e)return;delete e.sortie;delete e.motif;delete e.docs;delete e.ref;S.coReq=S.coReq.filter(function(x){return x.emp!==e.id||x.done;});break;
    case 'doc':e=emp(S.empId);if(!e)return;if(!e.docs)e.docs={};e.docs[v]=!e.docs[v];break;
    case 'copyReg':
      var rg=[['N°','Matricule','Nom et prénom','Poste','Service','Contrat','Entrée','Sortie','Motif de sortie'].join('\t')];
      S.emps.slice().sort(function(x,y){return x.entree<y.entree?-1:1;}).forEach(function(x,n){rg.push([n+1,x.mat,x.name,x.poste,x.svc||'',x.ct,fr(x.entree),x.sortie?fr(x.sortie):'',x.motif||''].join('\t'));});
      copy(rg.join('\n'),'Registre copié : collez-le dans Excel.');return;
    case 'hire':
      c=cand(v);if(!c)return;
      if(!c.hired||!emp(c.hired)){e={id:'n'+(S.seq++),mat:nextMat(),name:c.name,poste:t.title,svc:'',ct:'CDD',entree:today(),essai:'',fin:'',ev:[]};S.emps.push(e);c.hired=e.id;toast('Dossier salarié créé pour '+c.name+'. Complétez le contrat et les dates.');}
      S.tab='emp';S.empId=c.hired;S.efilter='all';S.ui={};toTop();break;
    case 'showAddOffre':S.ui={addOffre:true};break;
    case 'saveOffre':
      var ot=val('of-t'),om=val('of-mail'),au=document.getElementById('of-auto');
      if(!ot){toast('Indiquez l’intitulé du poste.');return;}
      if(om.indexOf('@')<1){toast('Indiquez l’e-mail de réception des candidatures.');return;}
      o={id:'o'+(S.seq++),title:ot,domain:val('of-dom'),lieu:val('of-lieu'),ct:val('of-ct'),desc:val('of-desc'),kw:val('of-kw'),email:om,link:val('of-link'),auto:!!(au&&au.checked),seuil:+val('of-seuil')||60,pub:true,at:Date.now()};
      if(o.auto&&!kwList(o).length){toast('Ajoutez les compétences recherchées : elles servent à comparer les CV.');return;}
      if(o.auto&&!o.link){toast('Ajoutez le lien du test pour l’envoi automatique.');return;}
      S.offers.unshift(o);S.ui={};toTop();toast('Offre publiée. Les candidats qui suivent « '+o.domain+' » sont alertés.');break;
    case 'offre':S.tab='offre';S.offerId=v;S.ui={};toTop();break;
    case 'offAuto':o=offer(S.offerId);if(!o)return;if(!o.auto&&!kwList(o).length){toast('Cette offre n’a pas de compétences à comparer.');return;}o.auto=!o.auto;break;
    case 'offPub':o=offer(S.offerId);if(!o)return;o.pub=!o.pub;break;
    case 'sendTest':
      var sa=appById(v);if(!sa)return;o=offer(sa.offerId);if(!o)return;
      sendTest(sa,o,false);toast('Test envoyé à '+sa.name+'.');break;
    case 'rejApp':var ra=appById(v);if(ra)ra.rejet=true;break;
    case 'ctab':S.ctab=v;S.ui={};toTop();break;
    case 'pdom':var di=S.profile.domains.indexOf(v);if(di>=0)S.profile.domains.splice(di,1);else S.profile.domains.push(v);break;
    case 'palerts':S.profile.alerts=!S.profile.alerts;break;
    case 'cvEx':S.profile.cv=CV_EX;toast('CV d’exemple chargé. Remplacez-le par le vôtre quand vous voulez.');break;
    case 'seen':if(S.profile.seen.indexOf(v)<0)S.profile.seen.push(v);break;
    case 'apply':
      o=offer(v);var P=S.profile;if(!o)return;
      if(!P.name.trim()||!norm(P.cv)){S.ctab='profil';toTop();toast('Indiquez votre nom et votre CV avant de postuler.');break;}
      if(S.apps.some(function(x){return x.offerId===v&&x.me;}))return;
      var mm=matchCv(o,P.cv),na={id:'a'+(S.seq++),offerId:v,me:true,name:P.name.trim(),contact:P.contact,pct:mm.pct,ko:mm.ko,at:Date.now()};
      S.apps.push(na);if(P.seen.indexOf(v)<0)P.seen.push(v);
      mail(o.email||'[E-MAIL DE RÉCEPTION]','Nouvelle candidature : '+na.name+' – '+o.title,'Candidat : '+na.name+(na.contact?' ('+na.contact+')':'')+'\nPoste : '+o.title+'\nCorrespondance du CV : '+mm.pct+' %'+(mm.ko.length?'\nCompétences absentes du CV : '+mm.ko.join(', '):'')+'\n\nCV :\n'+P.cv);
      if(o.auto&&mm.total&&mm.pct>=o.seuil){sendTest(na,o,true);toast('Candidature envoyée. Votre CV correspond : le test vous a été envoyé.');}
      else toast('Candidature envoyée.');
      break;
    default:return;
  }
  save();render();
}
app.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el||el.disabled)return;
  var a=el.getAttribute('data-a'),i=a.indexOf(':');
  act(i<0?a:a.slice(0,i),i<0?'':a.slice(i+1));
});
function onField(e){
  var f=e.target&&e.target.getAttribute?e.target.getAttribute('data-f'):null;
  if(!f)return;
  var v=e.target.value;
  if(f.indexOf('w:')===0)S.test.weights[f.slice(2)]=+v;
  else if(f.indexOf('tvar:')===0){var pz=f.split(':'),TT=S.temps[S.per];if(TT){var vv=TT.val[pz[1]]=TT.val[pz[1]]||{};vv[pz[2]]=pz[2]==='obs'?v:(+v||0);}}
  else if(f.indexOf('dest:')===0){var dz=f.split(':');S.dest[dz[1]]=S.dest[dz[1]]||{};S.dest[dz[1]][dz[2]]=v;}
  else if(f.indexOf('mgr:')===0){var mz=f.split(':'),mk=mz.slice(1,-1).join(':');S.dest.mgr[mk]=S.dest.mgr[mk]||{};S.dest.mgr[mk][mz[mz.length-1]]=v;}
  else if(f==='mgrfmt')S.dest.mgrFmt=v;
  else if(f.indexOf('ry:')===0){var er=emp(f.slice(3));if(er&&er.ref)er.ref.reply=v;}
  else if(f.indexOf('p:')===0)S.profile[f.slice(2)]=v;
  else if(f.indexOf('e:')===0){var em=emp(S.empId);if(em)em[f.slice(2)]=v;}
  else if(f==='perQ'||f==='count')S.test[f]=+v;
  else S.test[f]=v;
  save();patch();
}
app.addEventListener('input',onField);
app.addEventListener('input',function(e){var k=e.target&&e.target.getAttribute?e.target.getAttribute('data-s'):null;if(!k||!F[k])return;F[k].q=e.target.value;if(F[k].lim)F[k].lim=50;refresh(k);});
app.addEventListener('change',function(e){var k=e.target&&e.target.getAttribute?e.target.getAttribute('data-sf'):null;if(!k)return;var p=k.split(':');if(!F[p[0]])return;F[p[0]][p[1]]=e.target.value;refresh(p[0]);});
app.addEventListener('change',onField);
app.addEventListener('change',function(e){var c=e.target&&e.target.getAttribute?e.target.getAttribute('data-c'):null;if(!c)return;var i=c.indexOf(':');if(i>0)act(c.slice(0,i),c.slice(i+1)+'|'+e.target.value);else act(c,e.target.value);});
app.addEventListener('change',function(e){var t=e.target;if(!t||!t.getAttribute||!t.files||!t.files[0])return;var ak2=t.getAttribute('data-att');if(ak2){addAtt(ak2,t.files);t.value='';return;}if(t.getAttribute('data-imp')==='temps'){importFile(t.files[0]);t.value='';return;}var j=t.getAttribute('data-just');if(j){attachJust(j,t.files[0]);t.value='';}});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden||S.mode!=='cand'||!S.test.rules.tab)return;
  var c=cand(S.playId);
  if(c&&c.status==='cours'&&c.run){c.run.exits=(c.run.exits||0)+1;save();}
});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(S.ui.viewJust){S.ui={};render();return;}if(S.mode==='rh'&&S.ui.rate)act('rateLater','');else if(coReqOpen())act('coLater','');});
setInterval(function(){
  if(S.mode!=='cand')return;
  var c=cand(S.playId);
  if(!c||c.status!=='cours'||!c.run)return;
  var r=remaining(c),el=document.getElementById('timer');
  if(r<=0){finish(c,true);S.ui={};save();render();toast('Temps écoulé : le test est terminé.');}
  else if(el)el.textContent=clock(r)+' restantes';
},1000);

ensureSample();
render();
})();
</script>
</body></html>
