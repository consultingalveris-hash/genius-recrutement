<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace candidat — Genius Recrutement</title>
<meta name="theme-color" content="#0E7C86">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/illus.js"></script>
<style>
.offer{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit}
.co-logo{flex:none;width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:800;color:#0E7C86}
.co-logo img{max-width:52px;max-height:52px;object-fit:contain}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.me-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--accent-soft-fg);overflow:hidden}
.me-photo img{width:100%;height:100%;object-fit:cover}
.desc{white-space:pre-wrap;color:var(--fg-2)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters .in{width:auto;flex:1;min-width:180px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/offres"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg></span>Genius <span style="font-weight:600;color:var(--muted)">Candidats</span></a>
  <nav class="nav" id="nav"></nav>
  <div class="who" id="who"></div>
</div></header>
<main id="app"></main>
<footer style="text-align:center;padding:20px 16px 36px" class="small muted"><a href="/confidentialite.html">Confidentialité</a> · <a href="/mentions-legales.html">Mentions légales</a> · <a href="/">Vous recrutez ?</a></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script>
(function(){
'use strict';
var ME=null, FAM=[], CONTRACTS=[], VAPID='', app=document.getElementById('app'), ROUTE=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},4000);}
function api(method,url,body){return fetch(url,{method:method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||'Erreur, réessayez.');e.status=r.status;throw e;}return j;});});}
function fmtDate(ms){return new Date(ms).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
function formData(f){var o={};Array.prototype.forEach.call(f.querySelectorAll('[name]'),function(el){o[el.name]=el.type==='checkbox'?el.checked:el.value;});return o;}
function bindForm(f,fn){f.addEventListener('submit',function(e){e.preventDefault();var b=f.querySelector('button[type=submit]'),er=f.querySelector('.err');if(er)er.hidden=true;b.disabled=true;
  Promise.resolve().then(function(){return fn(formData(f),f);}).catch(function(x){if(er){er.textContent=x.message;er.hidden=false;}else toast(x.message);}).then(function(){b.disabled=false;});});}
function modal(h){$('#modal').innerHTML='<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">'+h+'</div></div>';$('.modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});}
function closeModal(){$('#modal').innerHTML='';}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function coLogo(o){return '<span class="co-logo">'+(o.companyLogo?'<img src="'+esc(o.companyLogo)+'" alt="">':esc(initials(o.company)))+'</span>';}
var STAT={attente:['À confirmer','warn'],recue:['Reçue','neutral'],test_envoye:['Test envoyé','info'],retenue:['Retenue','ok'],refusee:['Non retenue','warn']};

function chrome(active){
  var items=[['#/offres','Offres','offres']];
  if(ME)items.push(['#/candidatures','Mes candidatures','candidatures'],['#/profil','Mon profil','profil']);
  $('#nav').innerHTML=items.map(function(i){return '<a href="'+i[0]+'" class="'+(active===i[2]?'on':'')+'">'+i[1]+'</a>';}).join('');
  $('#who').innerHTML=ME?'<span>'+esc(ME.name)+'</span><button class="btn sm" id="out">Se déconnecter</button>':'<a class="btn sm" href="#/login">Se connecter</a><a class="btn sm primary" href="#/signup">Créer mon compte</a>';
  if(ME)$('#out').addEventListener('click',function(){api('POST','/api/cand/logout').then(function(){ME=null;location.hash='#/offres';route();});});
}
var V={};

/* ---------- offres ---------- */
var F={q:'',family:''};
V.offres=function(){
  chrome('offres');var rt=ROUTE;
  var steps=ME?[['Photo',!!ME.photo],['CV',!!ME.cv],['Métier',!!ME.family],['Téléphone',!!ME.phone]]:[],done=steps.filter(function(x){return x[1];}).length;
  var hero=ME?'<section class="welcome"><div><h1>Bonjour '+esc(ME.name.split(' ')[0])+'</h1>'+(done<4?'<p>Votre profil est complet à '+Math.round(done*25)+' %. Il manque : '+steps.filter(function(x){return !x[1];}).map(function(x){return x[0].toLowerCase();}).join(', ')+'.</p><div class="meter"><i style="width:'+done*25+'%"></i></div><a class="btn primary" href="#/profil" style="margin-top:14px">Compléter mon profil</a>':'<p>Profil complet : vous pouvez postuler en un clic. '+(ME.alerts?'Les nouvelles offres de votre métier vous seront signalées.':'')+'</p>')+'</div></section>'
    :'<section class="welcome"><div><h1>Trouvez un poste à la hauteur de vos compétences</h1><p>Créez votre profil une fois, postulez en un clic et montrez ce que vous savez faire grâce aux tests.</p><a class="btn primary" href="#/signup" style="margin-top:14px">Créer mon profil gratuit</a></div></section>';
  if(ME&&!ME.verified)hero='<p class="note info" style="margin:0"><b>Confirmez votre adresse e-mail</b> : vos candidatures ne sont transmises aux entreprises qu’après ce clic. Un lien vous a été envoyé à '+esc(ME.email)+' (pensez aux courriers indésirables). <button class="btn sm" id="rv" type="button">Renvoyer l’e-mail</button></p>'+hero;
  app.innerHTML='<div class="wrap col">'+hero+'<div class="row between"><h2>Offres d’emploi</h2><input class="in" id="q" placeholder="Poste, entreprise, ville…" value="'+esc(F.q)+'" style="max-width:320px"></div>'+
  '<div class="chips" id="chips"><button class="chip'+(F.family?'':' on')+'" data-f="">Tous les métiers</button>'+FAM.map(function(f){var on=F.family===f.k;return '<button class="chip'+(on?' on':'')+'" data-f="'+f.k+'">'+GR.famIcon(f.k,18)+esc(f.name)+'</button>';}).join('')+'</div>'+
  '<div id="list" class="col"><p class="muted">Chargement…</p></div></div>';
  var rv=$("#rv");if(rv)rv.addEventListener("click",function(){rv.disabled=true;api('POST','/api/cand/verify/resend',{}).then(function(r){toast(r.already?'Adresse déjà confirmée.':r.sent?'E-mail renvoyé.':'L’envoi a échoué. Réessayez plus tard.');}).catch(handle).then(function(){rv.disabled=false;});});
  var t;$('#q').addEventListener('input',function(){F.q=this.value;clearTimeout(t);t=setTimeout(load,250);});
  $('#chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;F.family=b.dataset.f;V.offres();});
  function load(){api('GET','/api/offers?q='+encodeURIComponent(F.q)+'&family='+encodeURIComponent(F.family)).then(function(r){if(rt!==ROUTE)return;
    $('#list').innerHTML=r.offers.length?r.offers.map(function(o){return '<a class="card offer" href="#/offre/'+o.id+'">'+coLogo(o)+'<div class="grow"><div class="row between"><h3>'+esc(o.title)+'</h3>'+(o.applied?'<span class="pill ok">Déjà postulé</span>':'')+'</div>'+
      '<p class="small muted">'+esc(o.company)+(o.city?' · '+esc(o.city):'')+' · publiée le '+fmtDate(o.createdAt)+'</p><div class="tags">'+(o.contract?'<span class="pill neutral">'+esc(o.contract)+'</span>':'')+'<span class="pill info">'+esc(o.familyName)+'</span>'+(o.hasTest?'<span class="pill neutral">Test en ligne</span>':'')+'</div>'+
      '<p class="small" style="margin-top:8px;color:var(--fg-2)">'+esc(o.description)+(o.description.length>=220?'…':'')+'</p></div></a>';}).join(''):'<div class="card empty">'+GR.empty('offres')+'Aucune offre ne correspond pour le moment. '+(ME&&ME.alerts?'Vous serez prévenu dès qu’une offre de votre métier sera publiée.':'')+'</div>';
  }).catch(function(e){toast(e.message);});}
  load();
};
V.offre=function(id){
  chrome('offres');var rt=ROUTE;
  api('GET','/api/offers/'+id).then(function(r){if(rt!==ROUTE)return;var o=r.offer;
    app.innerHTML='<div class="wrap" style="max-width:820px"><a href="#/offres" class="small">← Toutes les offres</a><div class="card col" style="margin-top:12px">'+
    '<div class="offer">'+coLogo(o)+'<div><h1 style="font-size:26px">'+esc(o.title)+'</h1><p class="muted">'+esc(o.company)+(o.city?' · '+esc(o.city):'')+'</p><div class="tags">'+(o.contract?'<span class="pill neutral">'+esc(o.contract)+'</span>':'')+'<span class="pill info">'+esc(o.familyName)+'</span>'+(o.closesAt?'<span class="pill warn">Jusqu’au '+new Date(o.closesAt+'T12:00').toLocaleDateString('fr-FR')+'</span>':'')+'</div></div></div>'+
    '<div class="desc">'+esc(o.description)+'</div>'+
    (o.hasTest?'<p class="note info">Cette entreprise utilise un test en ligne. Vous le recevrez dès votre candidature : prévoyez un moment au calme.</p>':'')+
    (o.status!=='ouverte'?'<p class="note warn">Cette offre est fermée.</p>':o.applied?'<p class="note ok">Vous avez déjà postulé. Suivez votre candidature dans <a href="#/candidatures">Mes candidatures</a>.</p>':
      ME?'<button class="btn primary" id="apply" style="align-self:flex-start">Postuler en un clic</button>':'<div class="row"><a class="btn primary" href="#/signup">Créer mon compte pour postuler</a><a class="btn" href="#/login">J’ai déjà un compte</a></div>')+'</div></div>';
    if(!ME)try{sessionStorage.setItem('gr-after','#/offre/'+o.id);}catch(e){}
    var b=$('#apply');if(b)b.addEventListener('click',function(){applyModal(o);});
  }).catch(function(e){app.innerHTML='<div class="wrap"><div class="card empty">'+esc(e.message)+'<br><br><a class="btn" href="#/offres">Voir les offres</a></div></div>';});
};
function applyModal(o){
  var miss=[];if(!ME.cv)miss.push('votre CV');if(!ME.phone)miss.push('votre téléphone');
  modal('<h2>Postuler : '+esc(o.title)+'</h2><p class="muted" style="margin:6px 0 14px">Votre profil'+(ME.cv?' et votre CV':'')+' seront transmis à '+esc(o.company)+'.</p>'+
  (miss.length?'<p class="note warn">Il manque '+miss.join(' et ')+'. Vous pouvez postuler quand même, mais un profil complet a plus de chances. <a href="#/profil" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Compléter mon profil</a></p>':'')+
  '<form class="form" id="fa" style="margin-top:12px"><label class="field">Message à l’entreprise <span class="hint">Facultatif : quelques lignes sur votre motivation.</span><textarea class="in" name="message" rows="4" maxlength="1500"></textarea></label>'+
  '<p class="err" hidden></p><div class="row"><button class="btn primary" type="submit">Envoyer ma candidature</button><button class="btn" type="button" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Annuler</button></div></form>');
  bindForm($('#fa'),function(d){return api('POST','/api/offers/'+o.id+'/apply',d).then(function(r){
    if(r.pending){$('#modal .modal').innerHTML='<h2>Candidature enregistrée</h2><p class="note warn" style="margin:14px 0"><b>Dernière étape :</b> confirmez votre adresse e-mail en cliquant sur le lien reçu à l’inscription (regardez aussi dans les courriers indésirables ou l’onglet Promotions). Votre candidature sera transmise à l’entreprise dès ce clic.</p><div class="row"><button class="btn primary" id="rv2" type="button">Renvoyer l’e-mail</button><a class="btn" href="#/candidatures" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Mes candidatures</a></div>';
      var b2=$('#rv2');b2.addEventListener('click',function(){b2.disabled=true;api('POST','/api/cand/verify/resend',{}).then(function(){toast('E-mail renvoyé.');}).catch(handle);});return;}
    $('#modal .modal').innerHTML='<h2>Candidature envoyée ✓</h2>'+(r.testSent?'<p class="note info" style="margin:14px 0">L’entreprise vous propose un test en ligne. Vous l’avez reçu par e-mail ; vous pouvez aussi le passer tout de suite.</p><div class="row"><a class="btn primary" href="'+esc(r.link)+'">Passer le test maintenant</a><a class="btn" href="#/candidatures" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Plus tard</a></div>':'<p class="muted" style="margin:14px 0">L’entreprise a reçu votre candidature. Suivez-la dans « Mes candidatures ».</p><a class="btn primary" href="#/candidatures" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Mes candidatures</a>');
  });});
}

/* ---------- candidatures ---------- */
V.candidatures=function(){
  chrome('candidatures');var rt=ROUTE;
  api('GET','/api/cand/applications').then(function(r){if(rt!==ROUTE)return;
    app.innerHTML='<div class="wrap col" style="max-width:860px"><h1>Mes candidatures</h1>'+(r.applications.length?r.applications.map(function(a){var s=(a.status==='test_envoye'&&a.test&&a.test.status==='termine')?['Test terminé','ok']:(STAT[a.status]||[a.status,'neutral']);
      return '<div class="card offer">'+coLogo(a)+'<div class="grow"><div class="row between"><h3><a href="#/offre/'+a.offerId+'" style="color:inherit">'+esc(a.title)+'</a></h3><span class="pill '+s[1]+'">'+s[0]+'</span></div><p class="small muted">'+esc(a.company)+(a.city?' · '+esc(a.city):'')+' · envoyée le '+fmtDate(a.createdAt)+'</p>'+
      (a.test?(a.test.status==='termine'?'<p class="small" style="margin-top:8px">✓ Test terminé et transmis à l’entreprise.</p>':'<div class="row" style="margin-top:10px"><a class="btn sm primary" href="'+esc(a.test.link)+'">'+(a.test.status==='en_cours'?'Reprendre le test':'Passer le test')+'</a><span class="small muted">À faire d’une traite, au calme.</span></div>'):'')+'</div></div>';}).join(''):'<div class="card empty">'+GR.empty('candidats')+'Aucune candidature pour l’instant.<br><br><a class="btn primary" href="#/offres">Voir les offres</a></div>')+'</div>';
  }).catch(handle);
};

/* ---------- profil ---------- */
V.profil=function(){
  chrome('profil');var me=ME;
  app.innerHTML='<div class="wrap col" style="max-width:760px"><h1>Mon profil</h1>'+
  '<div class="card"><div class="row" style="gap:18px"><div class="me-photo">'+(me.photo?'<img src="'+esc(me.photo)+'" alt="Ma photo">':esc(initials(me.name)))+'</div><div class="col" style="gap:8px"><b>Photo de profil</b><span class="small muted">Une photo nette et professionnelle. Sans photo, vos initiales s’affichent.</span><div class="row"><label class="btn sm primary" style="cursor:pointer">Choisir une photo<input type="file" id="ph" accept="image/png,image/jpeg,image/webp" hidden></label>'+(me.photo?'<button class="link" id="phdel" style="color:var(--danger)">Retirer</button>':'')+'</div></div></div></div>'+
  '<div class="card col"><b>Mon CV</b>'+(me.cv?'<p class="small">Fichier actuel : <a href="/api/cand/cv" target="_blank" rel="noopener">'+esc(me.cv)+'</a></p>':'<p class="note warn">Aucun CV : ajoutez-le pour que les recruteurs le voient avec vos candidatures.</p>')+'<div><label class="btn sm '+(me.cv?'':'primary')+'" style="cursor:pointer">'+(me.cv?'Remplacer mon CV':'Ajouter mon CV')+'<input type="file" id="cv" accept="application/pdf" hidden></label> <span class="small muted">Format PDF, 3 Mo au plus.</span></div></div>'+
  '<form class="card form" id="fp"><b>Mes informations</b><div class="two"><label class="field">Nom complet<input class="in" name="name" required value="'+esc(me.name)+'"></label><label class="field">Téléphone<input class="in" name="phone" type="tel" value="'+esc(me.phone)+'" placeholder="+221 …"></label></div>'+
  '<div class="two"><label class="field">Ville<input class="in" name="city" value="'+esc(me.city)+'"></label><label class="field">Métier recherché <span class="hint">Sert aux alertes et à l’envoi automatique des tests.</span><select class="in" name="family"><option value="">— Choisir —</option>'+FAM.map(function(f){return '<option value="'+f.k+'"'+(me.family===f.k?' selected':'')+'>'+esc(f.name)+'</option>';}).join('')+'</select></label></div>'+
  '<label class="field">En une phrase <span class="hint">Exemple : « Conseillère clientèle, 4 ans d’expérience en centre d’appels »</span><input class="in" name="headline" maxlength="160" value="'+esc(me.headline)+'"></label>'+
  '<label class="check"><input type="checkbox" name="alerts"'+(me.alerts?' checked':'')+'><span><b>M’alerter par e-mail</b> dès qu’une offre de mon métier est publiée</span></label>'+
  '<p class="err" hidden></p><div><button class="btn primary" type="submit">Enregistrer</button></div></form>'+
  '<div class="card col"><b>Alertes sur ce téléphone ou cet ordinateur</b><p class="small muted">Recevez une notification dès qu’une offre de votre métier est publiée ou qu’un test vous est envoyé. Sur iPhone, ajoutez d’abord cette page à l’écran d’accueil (bouton Partager, puis « Sur l’écran d’accueil »).</p><div><button class="btn sm" id="push">Activer les notifications</button></div></div>'+
  '<div class="card col"><b>Mon compte</b><p class="small muted">'+esc(me.email)+'</p><div><button class="link" id="del" style="color:var(--danger)">Supprimer mon compte et mes données</button></div></div></div>';
  bindForm($('#fp'),function(d){return api('PUT','/api/cand/profile',d).then(function(r){ME=r.me;toast('Profil enregistré.');});});
  $('#ph').addEventListener('change',function(){var f=this.files[0];if(!f)return;resizeImage(f,320,function(data){api('PUT','/api/cand/photo',{dataUrl:data}).then(function(r){ME=r.me;toast('Photo enregistrée.');V.profil();}).catch(handle);});});
  if($('#phdel'))$('#phdel').addEventListener('click',function(){api('DELETE','/api/cand/photo').then(function(r){ME=r.me;V.profil();}).catch(handle);});
  $('#cv').addEventListener('change',function(){var f=this.files[0];if(!f)return;if(f.size>3*1024*1024){toast('Le CV ne doit pas dépasser 3 Mo.');return;}
    var rd=new FileReader();rd.onload=function(){var b64=String(rd.result).split(',')[1];toast('Envoi du CV…');api('PUT','/api/cand/cv',{name:f.name,data:b64}).then(function(r){ME=r.me;toast('CV enregistré.');V.profil();}).catch(handle);};rd.readAsDataURL(f);});
  $('#push').addEventListener('click',enablePush);
  $('#del').addEventListener('click',function(){modal('<h2>Supprimer votre compte ?</h2><p class="muted" style="margin:10px 0 18px">Votre profil, votre photo, votre CV et vos candidatures seront effacés définitivement. Les résultats de tests déjà transmis aux entreprises restent chez elles jusqu’à leur effacement automatique.</p><div class="row"><button class="btn primary" id="yes" style="background:var(--danger);border-color:var(--danger)">Supprimer définitivement</button><button class="btn" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Annuler</button></div>');
    $('#yes').addEventListener('click',function(){api('DELETE','/api/cand/account').then(function(){ME=null;closeModal();toast('Compte supprimé.');location.hash='#/offres';});});});
};
function resizeImage(file,max,cb){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL('image/jpeg',.85));};img.onerror=function(){toast('Image illisible. Essayez un fichier JPEG ou PNG.');};img.src=u;}
function b64ToU8(s){var p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('Cet appareil ne permet pas les notifications. Sur iPhone, ajoutez d’abord la page à l’écran d’accueil.');return;}
  navigator.serviceWorker.register('/sw.js').then(function(reg){return Notification.requestPermission().then(function(p){if(p!=='granted')throw new Error('Notifications refusées. Vous pouvez les autoriser dans les réglages du navigateur.');
    return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID)});});});})
  .then(function(sub){return api('POST','/api/cand/push',{subscription:sub.toJSON()});}).then(function(){toast('Notifications activées sur cet appareil.');}).catch(function(e){toast(e.message);});
}

/* ---------- comptes ---------- */
function authPage(title,sub,form,foot){chrome();app.innerHTML='<div class="narrow"><div class="card col"><div><h1 style="font-size:24px">'+title+'</h1>'+(sub?'<p class="muted" style="margin-top:6px">'+sub+'</p>':'')+'</div>'+form+'</div>'+(foot?'<p class="small muted" style="margin-top:16px;text-align:center">'+foot+'</p>':'')+'</div>';}
function after(){var h='#/offres';try{h=sessionStorage.getItem('gr-after')||h;sessionStorage.removeItem('gr-after');}catch(e){}location.hash=h;}
V.login=function(){authPage('Espace candidat — connexion','Retrouvez vos candidatures et les offres de votre métier.',
  '<form class="form" id="f"><label class="field">Adresse e-mail<input class="in" name="email" type="email" required autocomplete="email"></label><label class="field">Mot de passe<input class="in" name="password" type="password" required autocomplete="current-password"></label><p class="err" hidden></p><button class="btn primary block" type="submit">Se connecter</button><a class="small" href="#/forgot">Mot de passe oublié ?</a></form>',
  'Pas encore de compte ? <a href="#/signup">Créer mon compte candidat</a><br><br>Vous recrutez ? <a href="/app#/login">Espace RH</a>');
  bindForm($('#f'),function(d){return api('POST','/api/cand/login',d).then(function(r){ME=r.me;after();});});};
V.signup=function(){authPage('Créer mon compte candidat','Gratuit. Postulez en un clic et recevez les offres de votre métier.',
  '<form class="form" id="f"><label class="field">Nom complet<input class="in" name="name" required autocomplete="name"></label><label class="field">Adresse e-mail<input class="in" name="email" type="email" required autocomplete="email"></label>'+
  '<label class="field">Mot de passe <span class="hint">8 caractères au moins</span><input class="in" name="password" type="password" minlength="8" required autocomplete="new-password"></label>'+
  '<div class="two"><label class="field">Téléphone<input class="in" name="phone" type="tel" placeholder="+221 …"></label><label class="field">Ville<input class="in" name="city"></label></div>'+
  '<label class="field">Métier recherché<select class="in" name="family"><option value="">— Choisir —</option>'+FAM.map(function(f){return '<option value="'+f.k+'">'+esc(f.name)+'</option>';}).join('')+'</select></label>'+
  '<label class="check"><input type="checkbox" name="consent" required><span>J’accepte la <a href="/confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label>'+
  '<p class="err" hidden></p><button class="btn primary block" type="submit">Créer mon compte</button></form>','Déjà inscrit ? <a href="#/login">Se connecter</a>');
  bindForm($('#f'),function(d){return api('POST','/api/cand/signup',d).then(function(r){ME=r.me;toast(r.me.verified?'Compte créé. Ajoutez votre photo et votre CV.':'Compte créé. Confirmez votre adresse avec le lien reçu par e-mail.');var h='';try{h=sessionStorage.getItem('gr-after')||'';}catch(e){}if(h)after();else location.hash='#/profil';});});};
V.forgot=function(){authPage('Mot de passe oublié','Vous recevrez un lien pour en choisir un nouveau.','<form class="form" id="f"><label class="field">Adresse e-mail<input class="in" name="email" type="email" required></label><p class="err" hidden></p><button class="btn primary block" type="submit">Recevoir le lien</button></form>','<a href="#/login">Retour</a>');
  bindForm($('#f'),function(d,f){return api('POST','/api/cand/forgot',d).then(function(){f.innerHTML='<p class="note ok">Si un compte existe avec cette adresse, un e-mail vient de partir. Regardez aussi dans les courriers indésirables.</p>';});});};
V.reset=function(tok){authPage('Nouveau mot de passe','','<form class="form" id="f"><label class="field">Nouveau mot de passe<input class="in" name="password" type="password" minlength="8" required autocomplete="new-password"></label><p class="err" hidden></p><button class="btn primary block" type="submit">Enregistrer</button></form>');
  bindForm($('#f'),function(d){d.token=tok;return api('POST','/api/cand/reset',d).then(function(r){ME=r.me;toast('Mot de passe changé.');location.hash='#/offres';});});};

function handle(e){if(e.status===401){ME=null;location.hash='#/login';return;}toast(e.message);}
function route(){ROUTE++;var h=location.hash.replace(/^#\/?/,'')||'offres',p=h.split('/');window.scrollTo(0,0);
  var priv={candidatures:1,profil:1};if(priv[p[0]]&&!ME){location.hash='#/login';return;}
  if(ME&&(p[0]==='login'||p[0]==='signup')){location.hash='#/offres';return;}
  if(p[0]==='offres'&&p[1]==='verifie'){if(ME)ME.verified=true;history.replaceState(null,'','#/offres');toast('Adresse e-mail confirmée. Vous pouvez postuler.');}
  if(p[0]==='offre')return V.offre(p[1]);if(p[0]==='reset')return V.reset(p[1]||'');(V[p[0]]||V.offres)();}
window.addEventListener('hashchange',route);
api('GET','/api/cand/me').then(function(r){ME=r.me;FAM=r.families;CONTRACTS=r.contracts;VAPID=r.vapid;route();}).catch(function(){app.innerHTML='<div class="narrow"><p class="note warn">Le serveur ne répond pas. Réessayez dans un instant.</p></div>';});
})();
</script>
</body>
</html>
