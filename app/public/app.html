<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genius Recrutement</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/illus.js"></script>
</head>
<body>
<header class="top" id="top" hidden><div class="top-in">
  <a class="brand" href="#/accueil"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg></span>Genius Recrutement</a>
  <nav class="nav" id="nav"></nav>
  <div class="who"><span id="who"></span><button class="btn sm" id="logout">Se déconnecter</button></div>
</div></header>
<div id="notice"></div>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script>
(function(){
'use strict';
var ME=null, META=null, app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},4000);}
function api(method,url,body){
  return fetch(url,{method:method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||'Erreur, réessayez.');e.status=r.status;throw e;}return j;});});
}
function fmtDate(ms){return ms?new Date(ms).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';}
function fmtDT(ms){return ms?new Date(ms).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';}
function fmtSecs(s){if(s==null)return '';var m=Math.floor(s/60),r=s%60;return m+' min '+(r<10?'0':'')+r;}
var STATUS={invite:['Invité','neutral'],en_cours:['En cours','info'],termine:['Terminé','ok']};
function pill(st){var x=STATUS[st]||[st,'neutral'];return '<span class="pill '+x[1]+'">'+x[0]+'</span>';}
function busy(btn,on){if(!btn)return;btn.disabled=on;if(on){btn.dataset.t=btn.textContent;btn.textContent='Un instant…';}else if(btn.dataset.t){btn.textContent=btn.dataset.t;}}
function formData(f){var o={};$$('[name]',f).forEach(function(el){o[el.name]=el.type==='checkbox'?el.checked:el.value;});return o;}
function showErr(f,msg){var e=$('.err',f);if(e){e.textContent=msg||'';e.hidden=!msg;}}
function modal(html){var m=$('#modal');m.innerHTML='<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  $('.modal-bg',m).addEventListener('click',function(e){if(e.target===this)closeModal();});var f=$('input,textarea,button',m);if(f)f.focus();}
function closeModal(){$('#modal').innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ---------- chrome ---------- */
function chrome(active){
  var top=$('#top');top.hidden=!ME;if(!ME){$('#notice').innerHTML='';return;}
  $('#who').innerHTML=(ME.logo?'<img src="'+esc(ME.logo)+'" alt="Logo '+esc(ME.company)+'" style="height:36px;max-width:150px;object-fit:contain;display:block">':'')+'<span>'+esc(ME.company)+'</span>';$('#who').style.cssText='display:flex;align-items:center;gap:10px';
  var items=[['#/accueil','Accueil','accueil'],['#/tests','Mes tests','tests'],['#/offres','Offres','offres'],['#/personnel','Personnel','personnel'],['#/mails','E-mails','mails'],['#/account','Mon compte','account']];
  if(ME.superadmin)items.push(['#/admin','Administration','admin']);
  notice();
  $('#nav').innerHTML=items.map(function(i){return '<a href="'+i[0]+'" class="'+(active===i[2]?'on':'')+'">'+i[1]+'</a>';}).join('');
}
/* bandeau d'état du compte : adresse à confirmer, entreprise en cours de vérification */
function daysLeft(t){return Math.max(0,Math.ceil((t-Date.now())/864e5));}
var PLANS_UI=[['decouverte','Découverte','Gratuit',['2 offres ouvertes','20 candidats testés par mois','1 recruteur']],['essentiel','Essentiel','25 000 F HT / mois',['5 offres ouvertes','100 candidats testés par mois','3 recruteurs, votre logo']],['pro','Pro','60 000 F HT / mois',['Offres illimitées','500 candidats testés par mois','10 recruteurs, assistance prioritaire']]];
function planCard(pl,ni){
  var u=pl.usage,l=pl.limits;
  function bar(lbl,v,max){var pc=max?Math.min(100,Math.round(v/max*100)):0;return '<div class="col" style="gap:6px"><div class="row between small"><span>'+lbl+'</span><b>'+v+(max?' / '+max:'')+(max?'':' <span class="muted" style="font-weight:400">(illimité)</span>')+'</b></div>'+(max?'<div class="meter" style="width:100%;margin:0"><i style="width:'+pc+'%;'+(pc>=100?'background:var(--danger)':'')+'"></i></div>':'')+'</div>';}
  var head=pl.trial?'<p class="note info" style="margin:0"><b>Essai gratuit jusqu’au '+new Date(pl.trialUntil).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'</b> ('+daysLeft(pl.trialUntil)+' jours) : toutes les fonctions sont ouvertes. Ensuite, votre compte passera à la formule '+esc(pl.baseName)+'. Rien ne sera supprimé.</p>'
    :'<p class="note '+(pl.key==='decouverte'?'warn':'ok')+'" style="margin:0">Votre formule : <b>'+esc(pl.name)+'</b>.</p>';
  return '<div class="card col"><div><h2>Votre formule</h2></div>'+head+
    '<div class="col" style="gap:14px">'+bar('Offres ouvertes',u.offers,l.offers)+bar('Candidats testés ce mois-ci',u.tests,l.tests)+bar('Accès recruteurs',u.users,l.users)+
    '<div class="row between small"><span>Logo de l’entreprise</span><b>'+(l.logo?'Inclus':'Formules Essentiel et Pro')+'</b></div></div>'+
    '<div class="grid3" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">'+PLANS_UI.map(function(p){var cur=(pl.trial?pl.base:pl.key)===p[0];return '<div style="border:1px solid '+(cur?'#0E7C86':'var(--line)')+';border-radius:12px;padding:14px;'+(cur?'background:var(--accent-soft)':'')+'"><b>'+p[1]+'</b>'+(cur?' <span class="pill info">'+(pl.trial?'après l’essai':'actuelle')+'</span>':'')+'<div style="font-weight:800;margin:6px 0">'+p[2]+'</div><ul class="small" style="margin:0;padding-left:18px">'+p[3].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';}).join('')+'</div>'+
    '<p class="small muted">Pour changer de formule : écrivez à <a href="mailto:consultingalveris@gmail.com">consultingalveris@gmail.com</a> ou appelez le (+221) 76 595 67 65. Paiement par Wave, Orange Money ou virement. Paiement annuel : 12 mois pour le prix de 10.</p></div>';
}
function notice(){var n=$('#notice'),m='';
  if(ME.superadmin){n.innerHTML='';return;}
  if(!ME.verified)m='<b>Confirmez votre adresse e-mail.</b> Un lien vous a été envoyé à '+esc(ME.email)+' (pensez aux courriers indésirables). Tant que l’adresse n’est pas confirmée, vos tests et vos offres restent en préparation : rien n’est envoyé aux candidats. <button class="btn sm" id="rv" type="button">Renvoyer l’e-mail</button>';
  else if(ME.companyStatus==='en_attente')m='<b>Votre entreprise est en cours de vérification</b> par l’équipe Genius Recrutement, en général sous 24 heures ouvrées. Vous pouvez déjà préparer vos tests et vos offres : elles deviendront visibles et les candidats seront prévenus dès la validation.';
  else if(ME.needsInfo&&ME.role!=='recruteur')m='<b>Complétez les informations de votre entreprise</b> : NINEA et téléphone. <a href="#/account">Les ajouter dans Mon compte</a>.';
  else if(ME.plan&&ME.plan.trial&&daysLeft(ME.plan.trialUntil)<=14)m='<b>Votre essai gratuit se termine dans '+daysLeft(ME.plan.trialUntil)+' jour'+(daysLeft(ME.plan.trialUntil)>1?'s':'')+'.</b> Ensuite, votre compte passera à la formule Découverte (gratuite, avec des limites). <a href="#/account">Voir les formules</a>.';
  else if(ME.companyStatus==='suspendue')m='<b>Le compte de votre entreprise est suspendu.</b> Vos offres ne sont plus visibles. Écrivez à <a href="mailto:consultingalveris@gmail.com">consultingalveris@gmail.com</a>.';
  n.innerHTML=m?'<div class="wrap" style="padding-bottom:0"><p class="note '+(ME.companyStatus==='suspendue'?'warn':'info')+'" style="margin:0">'+m+'</p></div>':'';
  var b=$('#rv');if(b)b.addEventListener('click',function(){busy(b,true);api('POST','/api/verify/resend',{}).then(function(r){toast(r.already?'Adresse déjà confirmée.':r.sent?'E-mail renvoyé à '+ME.email+'.':'L’envoi a échoué. Réessayez dans quelques minutes.');}).catch(handle).then(function(){busy(b,false);});});
}
$('#logout').addEventListener('click',function(){api('POST','/api/logout').then(function(){ME=null;location.hash='#/login';});});

/* ---------- comptes ---------- */
function authPage(title,sub,form,foot){
  chrome();app.innerHTML='<div class="narrow"><a class="brand" href="/" style="margin-bottom:28px"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg></span>Genius Recrutement</a>'+
  '<div class="card col"><div><h1 style="font-size:24px">'+title+'</h1>'+(sub?'<p class="muted" style="margin-top:6px">'+sub+'</p>':'')+'</div>'+form+'</div>'+(foot?'<p class="small muted" style="margin-top:16px;text-align:center">'+foot+'</p>':'')+'</div>';
}
function bindForm(sel,fn){var f=$(sel);f.addEventListener('submit',function(e){e.preventDefault();var b=$('button[type=submit]',f);showErr(f,'');busy(b,true);
  Promise.resolve().then(function(){return fn(formData(f),f);}).catch(function(err){showErr(f,err.message);}).then(function(){busy(b,false);});});}
var V={};
var LEGAL='<br><br><a href="/confidentialite.html" target="_blank" rel="noopener">Confidentialité</a> · <a href="/mentions-legales.html" target="_blank" rel="noopener">Mentions légales</a>';
var CAND_NOTE=LEGAL+'</p><div class="card" style="margin-top:18px;text-align:left"><h3 style="margin-bottom:6px">Vous êtes candidat ?</h3><p class="muted small">Vous n’avez pas besoin de compte. Ouvrez le lien personnel reçu par e-mail (ou par message) de l’entreprise qui recrute : il vous mène directement à votre test.</p></div><p>';
V.login=function(){
  authPage('Espace RH — connexion','Pour les recruteurs : créez vos tests et suivez les résultats de vos candidats.',
  '<form class="form" id="f"><label class="field">Adresse e-mail<input class="in" name="email" type="email" autocomplete="email" required></label>'+
  '<label class="field">Mot de passe<input class="in" name="password" type="password" autocomplete="current-password" required></label>'+
  '<p class="err" hidden></p><button class="btn primary block" type="submit">Se connecter</button>'+
  '<a class="small" href="#/forgot">Mot de passe oublié ?</a></form>','Pas encore de compte entreprise ? <a href="#/signup">Créer un compte</a>'+CAND_NOTE);
  bindForm('#f',function(d){return api('POST','/api/login',d).then(function(r){ME=r.user;location.hash='#/accueil';});});
};
V.signup=function(){
  authPage('Espace RH — créer un compte','Un compte par entreprise, pour les recruteurs. 2 mois d’essai gratuit, avec toutes les fonctions.',
  '<form class="form" id="f"><label class="field">Nom de l’entreprise<input class="in" name="company" required maxlength="120" autocomplete="organization"></label>'+
  '<div class="two"><label class="field">NINEA <span class="hint">Ou numéro d’immatriculation hors Sénégal</span><input class="in" name="ninea" required maxlength="40"></label><label class="field">Téléphone<input class="in" name="phone" type="tel" required maxlength="30" autocomplete="tel" placeholder="77 000 00 00"></label></div>'+
  '<label class="field">Votre nom<input class="in" name="name" required maxlength="120" autocomplete="name"></label>'+
  '<label class="field">Adresse e-mail<input class="in" name="email" type="email" required autocomplete="email"></label>'+
  '<label class="field">Mot de passe <span class="hint">8 caractères au moins</span><input class="in" name="password" type="password" minlength="8" required autocomplete="new-password"></label>'+
  '<p class="err" hidden></p><button class="btn primary block" type="submit">Créer mon compte</button></form>','Déjà inscrit ? <a href="#/login">Se connecter</a>'+CAND_NOTE);
  bindForm('#f',function(d){return api('POST','/api/signup',d).then(function(r){ME=r.user;toast('Compte créé. Bienvenue !');location.hash='#/tests/new';});});
};
V.forgot=function(){
  authPage('Mot de passe oublié','Indiquez votre adresse : vous recevrez un lien pour choisir un nouveau mot de passe.',
  '<form class="form" id="f"><label class="field">Adresse e-mail<input class="in" name="email" type="email" required autocomplete="email"></label>'+
  '<p class="err" hidden></p><button class="btn primary block" type="submit">Recevoir le lien</button></form>','<a href="#/login">Retour à la connexion</a>');
  bindForm('#f',function(d,f){return api('POST','/api/forgot',d).then(function(){f.innerHTML='<p class="note ok">Si un compte existe avec cette adresse, un e-mail vient de partir. Pensez à regarder dans les courriers indésirables.</p>';});});
};
V.reset=function(tok){
  authPage('Nouveau mot de passe','',
  '<form class="form" id="f"><label class="field">Nouveau mot de passe <span class="hint">8 caractères au moins</span><input class="in" name="password" type="password" minlength="8" required autocomplete="new-password"></label>'+
  '<p class="err" hidden></p><button class="btn primary block" type="submit">Enregistrer</button></form>');
  bindForm('#f',function(d){d.token=tok;return api('POST','/api/reset',d).then(function(r){ME=r.user;toast('Mot de passe changé.');location.hash='#/tests';});});
};

/* ---------- liste des tests ---------- */
V.tests=function(){var rt=ROUTE;
  chrome('tests');app.innerHTML='<div class="wrap"><p class="muted">Chargement…</p></div>';
  api('GET','/api/tests').then(function(r){if(rt!==ROUTE)return;
    var act=r.tests.filter(function(t){return !t.archived;}),arc=r.tests.filter(function(t){return t.archived;});
    function card(t){return '<a class="card col" href="#/tests/'+t.id+'" style="text-decoration:none;color:inherit">'+
      '<div class="row between"><h3>'+esc(t.title)+'</h3>'+(t.expired?'<span class="pill warn">Date passée</span>':t.archived?'<span class="pill neutral">Archivé</span>':'<span class="pill ok">Ouvert</span>')+'</div>'+
      '<p class="small muted">'+esc(t.familyName)+' · niveau '+({debutant:'Débutant',confirme:'Confirmé',expert:'Expert'}[t.level]||'Confirmé')+' · '+t.count+' questions · environ '+t.minutes+' min'+(t.deadline?' · jusqu’au '+fmtDate(new Date(t.deadline+'T12:00').getTime()):'')+'</p>'+
      '<div class="row small"><b>'+t.candidates+'</b> invité'+(t.candidates>1?'s':'')+'<span class="muted">·</span><b>'+t.done+'</b> terminé'+(t.done>1?'s':'')+'</div></a>';}
    app.innerHTML='<div class="wrap col"><div class="row between"><div><h1>Mes tests</h1><p class="muted" style="margin-top:4px">Un test par poste à pourvoir. Ouvrez-en un pour inviter des candidats et voir le classement.</p></div><a class="btn primary" href="#/tests/new">+ Nouveau test</a></div>'+
      (act.length?'<div class="grid">'+act.map(card).join('')+'</div>':'<div class="card empty">'+GR.empty('tests')+'<h2 style="color:var(--fg)">Aucun test pour l’instant</h2><p style="margin:8px 0 18px">Commencez par créer le test du poste que vous voulez pourvoir.</p><a class="btn primary" href="#/tests/new">Créer mon premier test</a></div>')+
      (arc.length?'<h2 style="margin-top:12px">Archivés</h2><div class="grid">'+arc.map(card).join('')+'</div>':'')+'</div>';
  }).catch(handle);
};

/* ---------- création / modification ---------- */
V.testForm=function(id){var rt=ROUTE;
  chrome('tests');app.innerHTML='<div class="wrap"><p class="muted">Chargement…</p></div>';
  Promise.all([META?Promise.resolve(META):api('GET','/api/meta'),id?api('GET','/api/tests/'+id):Promise.resolve(null)]).then(function(x){if(rt!==ROUTE)return;
    META=x[0];var t=x[1]?x[1].test:{title:'',replyEmail:ME.email,perQ:META.defaults.perQ,count:META.defaults.count,weights:META.defaults.weights,back:true,deadline:'',level:META.defaults.level};
    var sel=function(name,vals,cur,lab){return '<select class="in" name="'+name+'">'+vals.map(function(v){return '<option value="'+v+'"'+(+v===+cur?' selected':'')+'>'+lab(v)+'</option>';}).join('')+'</select>';};
    app.innerHTML='<div class="wrap" style="max-width:760px"><a href="'+(id?'#/tests/'+id:'#/tests')+'" class="small">← Retour</a>'+
    '<h1 style="margin:10px 0 18px">'+(id?'Modifier le test':'Nouveau test')+'</h1>'+
    '<form class="card form" id="f">'+
    '<label class="field">Métier du test <span class="hint">Les questions de connaissances et de mises en situation sont tirées dans ce métier. Français et logique sont communs à tous.</span><select class="in" name="family">'+META.families.map(function(f){return '<option value="'+f.k+'"'+((t.family||'cc')===f.k?' selected':'')+'>'+esc(f.name)+'</option>';}).join('')+'</select></label>'+
    '<label class="field">Niveau du poste <span class="hint">Règle la part de questions faciles, moyennes et difficiles. « Confirmé » convient à la plupart des postes.</span><select class="in" name="level">'+META.levels.map(function(l){return '<option value="'+l.k+'"'+((t.level||'confirme')===l.k?' selected':'')+'>'+esc(l.name)+'</option>';}).join('')+'</select></label>'+
    '<label class="field">Poste à pourvoir <span class="hint">Il apparaît dans l’e-mail envoyé au candidat.</span><input class="in" name="title" required maxlength="160" value="'+esc(t.title)+'" placeholder="Ex. : Conseiller clientèle – centre d’appels"></label>'+
    '<label class="field">E-mail de réception des résultats <span class="hint">Vous y recevez un message à chaque test terminé. Les candidats peuvent aussi y répondre.</span><input class="in" name="replyEmail" type="email" required value="'+esc(t.replyEmail)+'"></label>'+
    '<div class="two"><label class="field">Nombre de questions'+sel('count',[10,15,20,25,30,35,40],t.count,function(v){return v+' questions';})+'</label>'+
    '<label class="field">Temps par question <span class="hint">Les calculs ont toujours au moins 60 secondes.</span>'+sel('perQ',[15,20,30,45,60],t.perQ,function(v){return v+' secondes';})+'</label></div>'+
    '<label class="field">Date limite <span class="hint">Facultatif. Après cette date, le lien ne permet plus de commencer.</span><input class="in" name="deadline" type="date" value="'+esc(t.deadline)+'"></label>'+
    '<fieldset style="border:1px solid var(--line);border-radius:12px;padding:14px 16px"><legend style="font-weight:700;padding:0 6px">Poids de chaque compétence dans la note</legend>'+
    '<div class="two">'+META.comps.map(function(c){return '<label class="field">'+esc(c.name)+' <span class="hint">'+esc(c.desc)+'</span><input class="in" name="w_'+c.k+'" type="number" min="0" max="100" value="'+(t.weights[c.k]||0)+'"></label>';}).join('')+'</div>'+
    '<p class="small muted" style="margin-top:8px">Les questions sont tirées dans cette proportion. Mettez 0 pour ne pas évaluer une compétence.</p></fieldset>'+
    '<label class="check"><input type="checkbox" name="back"'+(t.back?' checked':'')+'><span><b>Autoriser le retour à la question précédente</b><br><span class="muted">Le candidat peut revenir sur une question tant qu’il lui reste du temps pour elle.</span></span></label>'+
    '<p class="err" hidden></p><div class="row"><button class="btn primary" type="submit">'+(id?'Enregistrer':'Créer le test')+'</button><a class="btn" href="'+(id?'#/tests/'+id:'#/tests')+'">Annuler</a></div></form></div>';
    bindForm('#f',function(d){
      var body={family:d.family,level:d.level,title:d.title,replyEmail:d.replyEmail,count:+d.count,perQ:+d.perQ,deadline:d.deadline,back:d.back,weights:{}};
      META.comps.forEach(function(c){body.weights[c.k]=+d['w_'+c.k]||0;});
      return (id?api('PUT','/api/tests/'+id,body).then(function(){return {id:id};}):api('POST','/api/tests',body)).then(function(r){toast(id?'Test enregistré.':'Test créé. Invitez maintenant vos candidats.');location.hash='#/tests/'+r.id;});
    });
  }).catch(handle);
};

/* ---------- un test : candidats et résultats ---------- */
var filt={q:'',st:''};
V.test=function(id){var rt=ROUTE;
  chrome('tests');
  Promise.all([META?Promise.resolve(META):api('GET','/api/meta'),api('GET','/api/tests/'+id)]).then(function(x){if(rt!==ROUTE)return;
    META=x[0];var t=x[1].test,cands=x[1].candidates;
    var done=cands.filter(function(c){return c.status==='termine';}),avg=done.length?Math.round(done.reduce(function(s,c){return s+c.global;},0)/done.length):null;
    var rank=0;cands.forEach(function(c){c.rank=c.status==='termine'?++rank:null;});
    function rows(){
      var q=filt.q.toLowerCase();
      var list=cands.filter(function(c){return (!filt.st||c.status===filt.st)&&(!q||(c.name+' '+c.email).toLowerCase().indexOf(q)>=0);});
      if(!list.length)return '<tr><td colspan="'+(6+META.comps.length)+'" class="empty">'+(cands.length?'Aucun candidat ne correspond à ce filtre.':'Aucun candidat invité pour l’instant. Cliquez sur « Inviter des candidats ».')+'</td></tr>';
      return list.map(function(c){
        var alerts=[];if(c.timeout)alerts.push('Temps dépassé');if(c.exits)alerts.push(c.exits+' sortie'+(c.exits>1?'s':'')+' de page');
        return '<tr><td class="num">'+(c.rank||'')+'</td><td><div class="row" style="gap:10px;flex-wrap:nowrap">'+photoOr(c.name,c.photo)+'<div><b>'+esc(c.name)+'</b><div class="small muted">'+esc(c.email)+'</div></div></div></td><td>'+pill(c.status)+'</td>'+

function parseList(txt){
  return txt.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var m=l.match(/[^\s<>,;]+@[^\s<>,;]+/);var email=m?m[0]:'';var name=l.replace(email,'').replace(/[<>,;\t]+/g,' ').replace(/\s+/g,' ').trim();
    return {name:name||email.split('@')[0],email:email};});
}

V.offre=function(id){
  chrome('offres');var rt=ROUTE;
  api('GET','/api/rh/offers/'+id).then(function(r){if(rt!==ROUTE)return;var o=r.offer,apps=r.applications;
    app.innerHTML='<div class="wrap col"><a href="#/offres" class="small">← Offres</a><div class="row between"><div><h1>'+esc(o.title)+'</h1><p class="muted" style="margin-top:4px">'+esc([o.familyName,o.city,o.contract].filter(Boolean).join(' · '))+' · '+(o.status==='ouverte'?'ouverte':'fermée')+'</p></div>'+
    '<div class="row"><button class="btn primary" id="share">Partager l’offre</button><a class="btn" href="'+esc(o.url)+'" target="_blank" rel="noopener">Voir l’annonce</a><a class="btn" href="#/offres/'+o.id+'/edit">Modifier</a><button class="btn" id="tog">'+(o.status==='ouverte'?'Fermer l’offre':'Rouvrir')+'</button></div></div>'+
    (function(st){var cells=[['Vues de l’annonce',st.views],['Candidatures',st.applications],['Tests terminés',st.tests+(st.avg!=null?'<span class="small muted"> · moy. '+st.avg+' %</span>':'')],['Entretiens',st.entretien],['Embauchés',st.embauche]];
      return '<div class="kpis" style="grid-template-columns:repeat(5,1fr)">'+cells.map(function(c,i){return '<div class="kpi'+(i===4?' accent':'')+'"><span class="small'+(i===4?'':' muted')+'">'+c[0]+'</span><b>'+c[1]+'</b>'+(i===1&&st.views?'<span class="small muted">'+Math.round(100*st.applications/st.views)+' % des vues</span>':'')+(i===1&&st.pending?'<span class="small muted">+ '+st.pending+' en attente de confirmation</span>':'')+'</div>';}).join('')+'</div>';})(r.stats)+
    '<div class="card tight"><div style="padding:14px 16px;border-bottom:1px solid var(--line-soft)" class="col"><h2>Candidatures ('+apps.length+')</h2><div class="chips" id="stg">'+STAGES.map(function(x){var n=x[0]==='all'?apps.length:apps.filter(function(a){return (a.stage||'nouvelle')===x[0];}).length;return '<button class="chip'+(OFILT===x[0]?' on':'')+'" data-f="'+x[0]+'">'+x[1]+' · '+n+'</button>';}).join('')+'</div></div><div class="table-wrap"><table><thead><tr><th>Candidat</th><th>Reçue le</th><th class="num">Test</th><th>Étape</th><th></th></tr></thead><tbody>'+
    (function(){var list=apps.filter(function(a){return OFILT==='all'||(a.stage||'nouvelle')===OFILT;});return list.length?list.map(function(a){
      return '<tr><td><div class="row" style="gap:10px;flex-wrap:nowrap">'+photoOr(a.name,a.photo)+'<div><b>'+esc(a.name)+'</b><div class="small muted">'+esc(a.headline||a.familyName)+'</div><div class="small muted">'+esc(a.email)+(a.phone?' · '+esc(a.phone):'')+(a.city?' · '+esc(a.city):'')+'</div></div></div></td>'+
      '<td class="small">'+fmtDate(a.createdAt)+'</td><td class="num">'+(a.test?(a.test.status==='termine'?'<b>'+a.test.global+' %</b>':'<span class="small muted">'+(a.test.status==='en_cours'?'en cours':'envoyé')+'</span>'):'<span class="small muted">—</span>')+'</td>'+
      '<td><select class="in" data-stage="'+a.id+'" style="min-height:34px;width:auto;padding:4px 8px" aria-label="Étape pour '+esc(a.name)+'">'+STAGES.slice(1).map(function(x){return '<option value="'+x[0]+'"'+((a.stage||'nouvelle')===x[0]?' selected':'')+'>'+x[2]+'</option>';}).join('')+'</select>'+(a.interview?'<div class="small" style="margin-top:6px;color:var(--accent-soft-fg)">Entretien : '+fmtDT(a.interview.at)+'</div>':'')+'</td>'+
      '<td><div class="row" style="gap:6px;flex-wrap:nowrap">'+(a.cv?'<a class="btn sm" href="'+esc(a.cv)+'" target="_blank" rel="noopener">CV</a>':'')+(a.message?'<button class="btn sm" data-msg="'+a.id+'">Message</button>':'')+(!a.test?'<button class="btn sm" data-test="'+a.id+'">Envoyer le test</button>':'')+'<button class="btn sm" data-iv="'+a.id+'">'+(a.interview?'Entretien…':'Planifier un entretien')+'</button>'+(a.stage==='embauche'?'<button class="btn sm primary" data-hire="'+a.id+'">Créer la fiche salarié</button>':'')+'</div></td></tr>';}).join(''):'<tr><td colspan="5" class="empty">'+(apps.length?'Aucune candidature à cette étape.':'Aucune candidature pour l’instant. Partagez le lien de l’annonce.')+'</td></tr>';})()+
    '</tbody></table></div></div>'+(o.testId?'<p class="small muted">Les résultats détaillés du test sont dans <a href="#/tests/'+o.testId+'">le classement du test associé</a>.</p>':'')+
    '<div><button class="link" id="del" style="color:var(--danger)">Supprimer cette offre et ses candidatures</button></div></div>';
    $('#share').addEventListener('click',function(){shareModal(o);});
    $('#tog').addEventListener('click',function(){api('PUT','/api/rh/offers/'+o.id,{status:o.status==='ouverte'?'fermee':'ouverte'}).then(function(){route();}).catch(handle);});
    $('#del').addEventListener('click',function(){modal('<h2>Supprimer cette offre ?</h2><p class="muted" style="margin:10px 0 18px">L’annonce et ses '+apps.length+' candidatures seront effacées. Les résultats de tests restent dans le test associé.</p><div class="row"><button class="btn primary" id="yes" style="background:var(--danger);border-color:var(--danger)">Supprimer</button><button class="btn" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Annuler</button></div>');
      $('#yes').addEventListener('click',function(){api('DELETE','/api/rh/offers/'+o.id).then(function(){closeModal();location.hash='#/offres';}).catch(handle);});});
    app.querySelector('tbody').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
      if(b.dataset.msg){var a=apps.filter(function(x){return x.id==b.dataset.msg;})[0];modal('<h2>Message de '+esc(a.name)+'</h2><p style="white-space:pre-wrap;margin:12px 0 18px">'+esc(a.message)+'</p><button class="btn" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Fermer</button>');}
      else if(b.dataset.iv){ivModal(apps.filter(function(x){return x.id==b.dataset.iv;})[0]);}
      else if(b.dataset.hire){var h=apps.filter(function(x){return x.id==b.dataset.hire;})[0];empModal({name:h.name,email:h.email,phone:h.phone,job:o.title,contract:o.contract,appId:h.id},function(id){location.hash='#/personnel/'+id;});}

      var save=function(notify){return api('PUT','/api/rh/applications/'+aid,{stage:st,notify:notify}).then(function(){closeModal();toast(notify?'Étape enregistrée, candidat prévenu.':'Étape enregistrée.');route();}).catch(handle);};
      if(!STG_MSG[st]){save(false);return;}
      modal('<h2>Passer à l’étape « '+esc(STAGES.filter(function(x){return x[0]===st;})[0][2])+' » ?</h2><p class="muted" style="margin:10px 0 18px">'+STG_MSG[st]+'</p><div class="row"><button class="btn primary" id="yes">Confirmer et prévenir</button><button class="btn" id="silent">Sans prévenir</button><button class="btn" id="no">Annuler</button></div>');
      $('#yes').addEventListener('click',function(){save(true);});$('#silent').addEventListener('click',function(){save(false);});$('#no').addEventListener('click',function(){sel.value=prev;closeModal();});});});
  }).catch(handle);
};

/* entretiens */
function pad2(n){return (n<10?'0':'')+n;}
function ivModal(a){var iv=a.interview,d=iv?new Date(iv.at):new Date(Date.now()+864e5);if(!iv){d.setHours(10,0,0,0);}
  var dv=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()),tv=pad2(d.getHours())+':'+pad2(d.getMinutes());
  modal('<h2>'+(iv?'Entretien avec ':'Planifier un entretien avec ')+esc(a.name)+'</h2><form class="form" id="fiv" style="margin-top:12px"><div class="two"><label class="field">Date<input class="in" type="date" name="d" required value="'+dv+'"></label><label class="field">Heure<input class="in" type="time" name="t" required value="'+tv+'"></label></div>'+
  '<label class="field">Lieu ou lien <span class="hint">Adresse, étage, ou lien de visioconférence.</span><input class="in" name="place" maxlength="300" value="'+esc(iv?iv.place:'')+'" placeholder="Ex. : Mermoz, immeuble X, 2e étage"></label>'+
  '<label class="field">Message au candidat <span class="hint">Facultatif : pièces à apporter, personne à demander…</span><textarea class="in" name="note" rows="3" maxlength="1000">'+esc(iv?iv.note||'':'')+'</textarea></label>'+
  '<label class="check"><input type="checkbox" name="notify" checked><span>Prévenir le candidat par e-mail (il recevra aussi un rappel la veille)</span></label>'+
  '<p class="err" hidden></p><div class="row"><button class="btn primary" type="submit">'+(iv?'Enregistrer':'Planifier')+'</button>'+(iv?'<button class="btn danger" type="button" id="ivdel">Annuler l’entretien</button>':'')+'<button class="btn" type="button" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Fermer</button></div></form>');
  bindForm('#fiv',function(f){var at=new Date(f.d+'T'+f.t);return api('POST','/api/rh/applications/'+a.id+'/interview',{at:at.toISOString(),place:f.place,note:f.note,notify:!!f.notify}).then(function(r){closeModal();toast(r.sent?'Entretien planifié, candidat prévenu.':'Entretien enregistré.');route();});});
  var del=$('#ivdel');if(del)del.addEventListener('click',function(){api('DELETE','/api/rh/interviews/'+iv.id).then(function(){closeModal();toast('Entretien annulé, candidat prévenu.');route();}).catch(handle);});
}

/* ---------- personnel ---------- */
var EMPMETA=null;
function empForm(e,meta){e=e||{};var c=(meta&&meta.contracts)||['CDI','CDD','Stage'];
  return '<div class="two"><label class="field">Nom et prénom<input class="in" name="name" required maxlength="120" value="'+esc(e.name||'')+'"></label><label class="field">Poste<input class="in" name="job" maxlength="120" value="'+esc(e.job||'')+'"></label></div>'+
  '<div class="two"><label class="field">Service<input class="in" name="service" maxlength="120" value="'+esc(e.service||'')+'"></label><label class="field">Contrat<select class="in" name="contract"><option value="">—</option>'+c.map(function(x){return '<option'+(e.contract===x?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select></label></div>'+
  '<div class="two"><label class="field">Date d’entrée<input class="in" type="date" name="startDate" value="'+esc(e.startDate||'')+'"></label><label class="field">Date de fin <span class="hint">CDD, stage ou départ</span><input class="in" type="date" name="endDate" value="'+esc(e.endDate||'')+'"></label></div>'+
  '<div class="two"><label class="field">Téléphone<input class="in" name="phone" maxlength="40" value="'+esc(e.phone||'')+'"></label><label class="field">E-mail<input class="in" type="email" name="email" value="'+esc(e.email||'')+'"></label></div>';

function readEmpForm(f){return {name:f.name,job:f.job,service:f.service,contract:f.contract,startDate:f.startDate,endDate:f.endDate,phone:f.phone,email:f.email};}
function empModal(pre,done){
  modal('<h2>Nouveau salarié</h2><form class="form" id="fem" style="margin-top:12px">'+empForm(pre,EMPMETA)+'<p class="err" hidden></p><div class="row"><button class="btn primary" type="submit">Créer la fiche</button><button class="btn" type="button" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Annuler</button></div></form>');
  bindForm('#fem',function(f){var b=readEmpForm(f);if(pre&&pre.appId)b.appId=pre.appId;return api('POST','/api/rh/employees',b).then(function(r){closeModal();toast('Fiche salarié créée.');done(r.id);});});
}

    app.innerHTML='<div class="wrap col"><div class="row between"><div><h1>Personnel</h1><p class="muted" style="margin-top:4px">Les dossiers de vos salariés, leurs absences et leurs documents, au même endroit. La paie n’est pas gérée ici.</p></div><button class="btn primary" id="addemp">+ Ajouter un salarié</button></div>'+
    (r.pending?'<p class="note info" style="margin:0">'+r.pending+' demande'+(r.pending>1?'s':'')+' d’absence à valider.</p>':'')+
    '<div class="kpis"><div class="kpi accent"><span class="small">Salariés présents</span><b>'+act.length+'</b></div><div class="kpi"><span class="small muted">Absents aujourd’hui</span><b>'+act.filter(function(e){return e.away;}).length+'</b></div><div class="kpi"><span class="small muted">Contrats finissant sous 30 jours</span><b>'+act.filter(function(e){return e.endingSoon;}).length+'</b></div><div class="kpi"><span class="small muted">Anciens salariés</span><b>'+past.length+'</b></div></div>'+
    (r.employees.length?'<div class="card tight"><div class="table-wrap"><table><thead><tr><th>Salarié</th><th>Contrat</th><th>Entrée</th><th>Situation</th><th class="num">Congés restants</th></tr></thead><tbody>'+act.map(row).join('')+past.map(row).join('')+'</tbody></table></div></div><p class="small muted">Congés restants : estimation à raison de 2 jours ouvrables par mois de service, selon le Code du travail sénégalais, moins les congés payés validés.</p>'

    $('#addemp').addEventListener('click',function(){empModal({},function(id){location.hash='#/personnel/'+id;});});
    app.querySelectorAll('[data-go]').forEach(function(tr){tr.addEventListener('click',function(){location.hash='#/personnel/'+tr.dataset.go;});});
  }).catch(handle);

  chrome('personnel');var rt=ROUTE;
  api('GET','/api/rh/employees/'+id).then(function(r){if(rt!==ROUTE)return;var e=r.employee,b=e.balance;EMPMETA=r;
    var LST={validee:['Validée','ok'],demandee:['À valider','warn'],refusee:['Refusée','neutral']};

/* partage d'une offre */
function shareModal(o){
  var txt=o.title+(o.city?' à '+o.city:'')+' : postulez sur Genius Recrutement',u=encodeURIComponent(o.url);
  modal('<h2>Partager l’offre</h2><p class="muted" style="margin:6px 0 14px">Le lien affiche un aperçu avec le titre, la ville et le logo de votre entreprise.</p>'+
  '<div class="row" style="gap:8px;flex-wrap:nowrap"><input class="in" id="shl" readonly value="'+esc(o.url)+'"><button class="btn" id="cp">Copier</button></div>'+
  '<div class="row" style="margin-top:14px;gap:8px"><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt+' '+o.url)+'">WhatsApp</a>'+
  '<a class="btn" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url='+u+'">LinkedIn</a>'+
  '<a class="btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u='+u+'">Facebook</a>'+
  '<a class="btn" href="mailto:?subject='+encodeURIComponent(o.title)+'&body='+encodeURIComponent(txt+'\n'+o.url)+'">E-mail</a></div>'+

    if(t.canManage)bindForm('#ft',function(d){return api('POST','/api/team/invite',d).then(function(r){
      if(r.sent)toast('Invitation envoyée à '+d.email+'.');else modal('<h2>Invitation créée</h2><p class="muted" style="margin:10px 0">L’e-mail n’a pas pu partir. Envoyez ce lien à votre collègue (valable 7 jours) :</p><p><input class="in" readonly value="'+esc(r.link)+'" onclick="this.select()"></p><button class="btn" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Fermer</button>');
      loadTeam();});});
    box.querySelectorAll('[data-rm]').forEach(function(b){b.addEventListener('click',function(){var m=t.members.filter(function(x){return x.id==b.dataset.rm;})[0];
      modal('<h2>Retirer '+esc(m.name)+' ?</h2><p class="muted" style="margin:10px 0 18px">Son accès sera supprimé immédiatement. Les tests, offres et candidatures restent dans le compte.</p><div class="row"><button class="btn primary" id="yes" style="background:var(--danger);border-color:var(--danger)">Retirer</button><button class="btn" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Annuler</button></div>');
      $('#yes').addEventListener('click',function(){api('DELETE','/api/team/'+m.id).then(function(){closeModal();toast('Accès retiré.');loadTeam();}).catch(handle);});});});
  }).catch(function(e){box.innerHTML='<p class="note warn">'+esc(e.message)+'</p>';});
}

    (r.candidates.length?r.candidates.map(function(c){return '<tr><td><b>'+esc(c.name)+'</b><div class="small muted">'+esc(c.email)+'</div></td><td class="small">'+esc(c.family||'–')+'</td><td>'+fmtDate(c.createdAt)+'</td><td>'+(c.verified?'<span class="pill ok">Confirmée</span>':'<span class="pill warn">Non confirmée</span>')+'</td><td class="num">'+c.apps+'</td><td style="text-align:right;white-space:nowrap">'+(c.verified?'':'<button class="btn sm" data-rv="'+esc(c.email)+'">Renvoyer le lien</button> <button class="btn sm" data-cf="'+esc(c.email)+'">Confirmer moi-même</button>')+'</td></tr>';}).join(''):'<tr><td colspan="6" class="empty">Aucun candidat inscrit pour l’instant.</td></tr>')+
    '</tbody></table></div></div>'+
    '<div class="card tight"><div style="padding:14px 16px;border-bottom:1px solid var(--line-soft)"><h2>E-mails de la plateforme</h2><p class="small muted" style="margin-top:4px">Confirmations d’adresse, mots de passe oubliés, alertes.</p></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Destinataire</th><th>Objet</th><th>État</th></tr></thead><tbody>'+
    (r.mails.length?r.mails.map(function(m){var ok=m.status==='envoye';return '<tr><td class="small">'+fmtDT(m.created_at)+'</td><td>'+esc(m.recipient)+'</td><td>'+esc(m.subject)+'</td><td><span class="pill '+(ok?'ok':'warn')+'" title="'+esc(m.error||'')+'">'+(ok?'Envoyé':m.status==='non_envoye'?'Non envoyé':'Échec')+'</span></td></tr>';}).join(''):'<tr><td colspan="4" class="empty">Aucun e-mail.</td></tr>')+
    '</tbody></table></div></div></div>';
    app.querySelectorAll('[data-rv],[data-cf]').forEach(function(b){b.addEventListener('click',function(){busy(b,true);
      api('POST','/api/admin/cand-verify',{email:b.dataset.rv||b.dataset.cf,confirm:!!b.dataset.cf}).then(function(x){toast(b.dataset.cf?'Adresse confirmée : ce candidat peut postuler.':x.sent?'Lien renvoyé.':'L’envoi a échoué.');route();}).catch(handle).then(function(){busy(b,false);});});});
    app.querySelectorAll('[data-plan]').forEach(function(sel){sel.addEventListener('change',function(){api('PUT','/api/admin/companies/'+sel.dataset.plan,{plan:sel.value}).then(function(){toast('Formule enregistrée.');}).catch(handle);});});
    app.querySelectorAll('[data-trial]').forEach(function(inp){inp.addEventListener('change',function(){api('PUT','/api/admin/companies/'+inp.dataset.trial,{trialUntil:inp.value}).then(function(){toast(inp.value?'Fin d’essai enregistrée.':'Essai terminé.');route();}).catch(handle);});});
    app.querySelectorAll('[data-st]').forEach(function(b){b.addEventListener('click',function(){
      busy(b,true);
      api('PUT','/api/admin/companies/'+b.dataset.id,{status:b.dataset.st}).then(function(x){toast(b.dataset.st==='valide'?'Entreprise validée'+(x.alerted?' : '+x.alerted+' candidat'+(x.alerted>1?'s':'')+' alerté'+(x.alerted>1?'s':''):'')+'.':'Entreprise suspendue : ses offres ne sont plus visibles.');route();}).catch(handle).then(function(){busy(b,false);});});});
  }).catch(handle);
};

/* ---------- routeur ---------- */
function handle(e){if(e.status===401){ME=null;location.hash='#/login';return;}if(e.status===404){app.innerHTML='<div class="wrap"><div class="card empty"><h2 style="color:var(--fg)">Page introuvable</h2><p style="margin:8px 0 16px">'+esc(e.message)+'</p><a class="btn" href="#/tests">Retour à mes tests</a></div></div>';return;}toast(e.message);}
var ROUTE=0;
function route(){ROUTE++;closeModal();
  var h=location.hash.replace(/^#\/?/,'')||'accueil',p=h.split('/');
  var pub={login:1,signup:1,forgot:1,reset:1,rejoindre:1};
  if(p[0]==='rejoindre')return V.join(p[1]||'');
  if(!ME&&!pub[p[0]]){location.hash='#/login';return;}
  if(ME&&(p[0]==='login'||p[0]==='signup')){location.hash='#/accueil';return;}
  window.scrollTo(0,0);
  if(p[0]==='reset')return V.reset(p[1]||'');
  if(p[0]==='accueil'&&p[1]==='verifie'){ME.verified=true;history.replaceState(null,'','#/accueil');toast('Adresse e-mail confirmée. Merci !');}
  if(p[0]==='personnel'&&p[1])return V.salarie(p[1]);
  if(p[0]==='offres'&&p[1]==='new')return V.offreForm(null);
  if(p[0]==='offres'&&p[1]&&p[2]==='edit')return V.offreForm(p[1]);
  if(p[0]==='offres'&&p[1]){if(V._lo!==p[1]){OFILT='all';V._lo=p[1];}return V.offre(p[1]);}
  if(p[0]==='tests'&&p[1]==='new')return V.testForm(null);
  if(p[0]==='tests'&&p[1]&&p[2]==='edit')return V.testForm(p[1]);
  if(p[0]==='tests'&&p[1]){if(V._last!==p[1]){filt={q:'',st:''};V._last=p[1];}return V.test(p[1]);}
  (V[p[0]]||V.accueil)();
}
window.addEventListener('hashchange',route);
api('GET','/api/me').then(function(r){ME=r.user;route();}).catch(function(){app.innerHTML='<div class="narrow"><p class="note warn">Le serveur ne répond pas. Réessayez dans un instant.</p></div>';});
})();
</script>
</body>
</html>
